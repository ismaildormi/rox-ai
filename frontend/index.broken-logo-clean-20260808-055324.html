    ['cy-GB', 'Welsh'],
    ['ga-IE', 'Irish'],
    ['hy-AM', 'Armenian'],
    ['ka-GE', 'Georgian']
  ];

  const getVoiceLanguage = () =>
    localStorage.getItem('roxVoiceLanguage') ||
    (navigator.languages && navigator.languages[0]) ||
    navigator.language ||
    'ar-MA';

  const roxVoiceQuickLanguages = [
    '',
    'ar-MA',
    'fr-FR',
    'en-US',
    'es-ES'
  ];

  const normalizeVoiceSearch = (value) =>
    String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim();

  const getVoiceLanguageLabel = (value) => {
    const language = voiceLanguages.find(
      ([code]) => code === value
    );

    return language
      ? language[1]
      : voiceLanguages[0][1];
  };

  const getVoiceLanguageRegion = (value) => {
    const parts = String(value || '').split('-');
    const region = parts[parts.length - 1];

    return /^[A-Za-z]{2}$/.test(region)
      ? region.toLowerCase()
      : '';
  };

  const renderVoiceLanguageFlag = (
    container,
    value
  ) => {
    container.replaceChildren();

    if (!value) {
      container.textContent = 'ðŸŒ';
      container.classList.add('is-auto');
      return;
    }

    container.classList.remove('is-auto');

    const region =
      getVoiceLanguageRegion(value);

    if (!region) {
      container.textContent =
        String(value)
          .split('-')[0]
          .slice(0, 2)
          .toUpperCase();

      return;
    }

    const image =
      document.createElement('img');

    image.src =
      `https://flagcdn.com/w40/${region}.png`;

    image.alt = '';
    image.loading = 'lazy';
    image.decoding = 'async';
    image.referrerPolicy = 'no-referrer';

    image.addEventListener(
      'error',
      () => {
        container.replaceChildren();
        container.textContent =
          region.toUpperCase();
      },
      { once: true }
    );

    container.appendChild(image);
  };

  const closeRoxVoiceLanguageMenus = (
    exceptRoot = null
  ) => {
    document
      .querySelectorAll('[data-rox-voice-language]')
      .forEach((root) => {
        if (root === exceptRoot) {
          return;
        }

        const trigger = root.querySelector(
          '[data-rox-voice-language-trigger]'
        );

        const menu = root.querySelector(
          '[data-rox-voice-language-menu]'
        );

        const search = root.querySelector(
          '[data-rox-voice-language-search]'
        );

        root.classList.remove('is-open');

        if (trigger) {
          trigger.setAttribute(
            'aria-expanded',
            'false'
          );
        }

        if (menu) {
          menu.hidden = true;
        }

        if (search && search.value) {
          search.value = '';
          search.dispatchEvent(
            new Event('input')
          );
        }
      });
  };

  const setVoiceLanguage = (
    selectedLanguage
  ) => {
    if (selectedLanguage) {
      localStorage.setItem(
        'roxVoiceLanguage',
        selectedLanguage
      );
    } else {
      localStorage.removeItem(
        'roxVoiceLanguage'
      );
    }

    document
      .querySelectorAll('[data-voice-language]')
      .forEach((select) => {
        select.value = selectedLanguage;
      });

    document
      .querySelectorAll('[data-rox-voice-language]')
      .forEach((root) => {
        const label = root.querySelector(
          '[data-rox-voice-language-label]'
        );

        const trigger = root.querySelector(
          '[data-rox-voice-language-trigger]'
        );

        const selectedLabel =
          getVoiceLanguageLabel(
            selectedLanguage
          );
        const selectedIcon =
          root.querySelector(
            '.rox-voice-language-icon'
          );

        if (selectedIcon) {
          renderVoiceLanguageFlag(
            selectedIcon,
            selectedLanguage
          );
        }

        if (label) {
          label.textContent = selectedLabel;
        }

        if (trigger) {
          trigger.title =
            `Voice language: ${selectedLabel}`;
        }

        root
          .querySelectorAll(
            '.rox-voice-language-option'
          )
          .forEach((option) => {
            const isSelected =
              option.dataset.value ===
              selectedLanguage;

            option.classList.toggle(
              'is-selected',
              isSelected
            );

            option.setAttribute(
              'aria-selected',
              String(isSelected)
            );
          });
      });
  };

  document
    .querySelectorAll('[data-voice-language]')
    .forEach((select) => {
      select.innerHTML = '';

      voiceLanguages.forEach(
        ([value, label]) => {
          const option =
            document.createElement('option');

          option.value = value;
          option.textContent = label;

          select.appendChild(option);
        }
      );
    });

  document
    .querySelectorAll('[data-rox-voice-language]')
    .forEach((root) => {
      const trigger = root.querySelector(
        '[data-rox-voice-language-trigger]'
      );

      const menu = root.querySelector(
        '[data-rox-voice-language-menu]'
      );

      const search = root.querySelector(
        '[data-rox-voice-language-search]'
      );

      const optionsBox = root.querySelector(
        '[data-rox-voice-language-options]'
      );

      if (
        !trigger ||
        !menu ||
        !search ||
        !optionsBox
      ) {
        return;
      }

      optionsBox.innerHTML = '';

      const createLanguageOption = (
        value,
        label
      ) => {
        const button =
          document.createElement('button');

        button.type = 'button';
        button.className =
          'rox-voice-language-option';

        button.dataset.value = value;
        button.dataset.search =
          normalizeVoiceSearch(
            `${label} ${value}`
          );

        button.setAttribute(
          'role',
          'option'
        );

        button.setAttribute(
          'aria-selected',
          'false'
        );

        const icon =
          document.createElement('span');

        icon.className =
          'rox-voice-language-option-icon';

        renderVoiceLanguageFlag(
          icon,
          value
        );

        const text =
          document.createElement('span');

        text.className =
          'rox-voice-language-option-text';

        text.textContent = label;

        const check =
          document.createElement('span');

        check.className =
          'rox-voice-language-check';

        check.textContent = 'âœ“';

        button.append(
          icon,
          text,
          check
        );

        button.addEventListener(
          'click',
          () => {
            setVoiceLanguage(value);
            closeRoxVoiceLanguageMenus();
          }
        );

        return button;
      };

      const appendSection = (
        title,
        languages
      ) => {
        if (!languages.length) {
          return;
        }

        const section =
          document.createElement('div');

        section.className =
          'rox-voice-language-section';

        section.textContent = title;

        optionsBox.appendChild(section);

        languages.forEach(
          ([value, label]) => {
            optionsBox.appendChild(
              createLanguageOption(
                value,
                label
              )
            );
          }
        );
      };

      const quickLanguages =
        roxVoiceQuickLanguages
          .map((code) =>
            voiceLanguages.find(
              ([value]) => value === code
            )
          )
          .filter(Boolean);

      const allLanguages =
        voiceLanguages.filter(
          ([value]) =>
            !roxVoiceQuickLanguages.includes(
              value
            )
        );

      appendSection(
        'Quick access',
        quickLanguages
      );

      appendSection(
        'All languages',
        allLanguages
      );

      const emptyMessage =
        document.createElement('div');

      emptyMessage.className =
        'rox-voice-language-empty';

      emptyMessage.textContent =
        'No language found';

      emptyMessage.hidden = true;

      optionsBox.appendChild(emptyMessage);

      search.addEventListener(
        'input',
        () => {
          const query =
            normalizeVoiceSearch(
              search.value
            );

          let visibleOptions = 0;

          optionsBox
            .querySelectorAll(
              '.rox-voice-language-option'
            )
            .forEach((option) => {
              const matches =
                !query ||
                option.dataset.search.includes(
                  query
                );

              option.hidden = !matches;

              if (matches) {
                visibleOptions += 1;
              }
            });

          optionsBox
            .querySelectorAll(
              '.rox-voice-language-section'
            )
            .forEach((section) => {
              section.hidden = Boolean(query);
            });

          emptyMessage.hidden =
            visibleOptions !== 0;
        }
      );

      trigger.addEventListener(
        'click',
        (event) => {
          event.stopPropagation();

          const shouldOpen = menu.hidden;

          closeRoxVoiceLanguageMenus(root);

          root.classList.toggle(
            'is-open',
            shouldOpen
          );

          menu.hidden = !shouldOpen;

          trigger.setAttribute(
            'aria-expanded',
            String(shouldOpen)
          );

          if (shouldOpen) {
            requestAnimationFrame(() => {
              search.focus();
            });
          }
        }
      );

      menu.addEventListener(
        'click',
        (event) => {
          event.stopPropagation();
        }
      );
    });

  const savedVoiceLanguage =
    localStorage.getItem(
      'roxVoiceLanguage'
    ) || '';

  const validVoiceLanguage =
    voiceLanguages.some(
      ([value]) =>
        value === savedVoiceLanguage
    )
      ? savedVoiceLanguage
      : '';

  setVoiceLanguage(
    validVoiceLanguage
  );

  document.addEventListener(
    'click',
    () => {
      closeRoxVoiceLanguageMenus();
    }
  );

  document.addEventListener(
    'keydown',
    (event) => {
      if (event.key === 'Escape') {
        closeRoxVoiceLanguageMenus();
      }
    }
  );
  document
    .querySelectorAll('[data-voice-input]')
    .forEach((button) => {
      const feature = button.dataset.voiceInput;

      const input = document.querySelector(
        `input[data-feature="${feature}"]`
      );

      if (!input) return;

      if (!VoiceRecognition) {
        button.addEventListener('click', () => {
          input.placeholder =
            roxT('voice.unavailable');
          input.focus();
        });

        return;
      }

      const recognition = new VoiceRecognition();

      recognition.lang =

        localStorage.getItem("roxVoiceLanguage") ||

        (navigator.languages && navigator.languages[0]) ||

        navigator.language ||

        "ar-MA";
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      const normalPlaceholder =
        input.getAttribute('placeholder') ||
        roxT('features.chat.placeholder');

      let textBeforeRecording = '';

      button.addEventListener('click', () => {
        if (button.classList.contains('is-listening')) {
          recognition.stop();
          return;
        }

        textBeforeRecording = input.value.trim();

        if (
          getRoxBooleanSetting(
            ROX_SETTINGS_KEYS.stopVoiceOnRecord,
            true
          ) &&
          'speechSynthesis' in window
        ) {
          window.speechSynthesis.cancel();
        }

        recognition.lang = getVoiceLanguage();

        try {
          recognition.start();
        } catch (error) {
          console.warn(
            'Voice recognition is already active:',
            error
          );
        }
      });

      recognition.addEventListener('start', () => {
        button.classList.add('is-listening');
        button.setAttribute('aria-pressed', 'true');
        button.title = roxT('voice.stopDictation');
        input.placeholder = roxT('voice.listening');
      });

      recognition.addEventListener('result', (event) => {
        let spokenText = '';

        for (
          let index = event.resultIndex;
          index < event.results.length;
          index++
        ) {
          spokenText +=
            event.results[index][0].transcript + ' ';
        }

        spokenText = spokenText.trim();

        input.value = [
          textBeforeRecording,
          spokenText
        ]
          .filter(Boolean)
          .join(' ');

        input.dispatchEvent(
          new Event('input', {
            bubbles: true
          })
        );
      });

      recognition.addEventListener('end', () => {
        button.classList.remove('is-listening');
        button.setAttribute('aria-pressed', 'false');
        button.title = roxT('voice.dictateMessage');
        input.placeholder =
          input.dataset.i18nPlaceholder
            ? roxT(input.dataset.i18nPlaceholder)
            : normalPlaceholder;
        input.focus();
      });

      recognition.addEventListener('error', (event) => {
        console.warn(
          'Voice recognition error:',
          event.error
        );

        button.classList.remove('is-listening');
        button.setAttribute('aria-pressed', 'false');
        button.title = roxT('voice.dictateMessage');

        input.placeholder =
          event.error === 'not-allowed'
            ? roxT('voice.allowMicrophone')
            : (
                input.dataset.i18nPlaceholder
                  ? roxT(input.dataset.i18nPlaceholder)
                  : normalPlaceholder
              );
      });
    });
}

<style>
  /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

  /* CORE METER â€” credits/usage gauge */
  .usage-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;position:relative;overflow:hidden;}
  .usage-card::before{content:'';position:absolute;inset:0;background:radial-gradient(220px 100px at 100% 0%, rgba(139,92,246,.14), transparent 70%);pointer-events:none;}
  .usage-label{position:relative;display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);margin-bottom:8px;}
  .usage-label span:last-child{color:var(--ember-2);font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .usage-bar{position:relative;height:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:10px;}
  .usage-fill{position:relative;height:100%;background:var(--ember-grad);border-radius:6px;overflow:hidden;transition:width .5s cubic-bezier(.16,1,.3,1);}
  .usage-fill::after{
    content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-18deg);animation:shimmerSweep 2.8s ease-in-out infinite;
  }
  @keyframes shimmerSweep{0%{left:-60%;}55%{left:130%;}100%{left:130%;}}
  .credits-num{position:relative;font-size:13.5px;font-weight:700;margin-bottom:12px;font-family:'Space Grotesk',sans-serif;line-height:1.4;}
  .upgrade-btn{
    width:100%;padding:11.5px;border-radius:10px;border:none;background:var(--ember-grad);color:#ffffff;
    font-weight:700;font-size:13px;cursor:pointer;position:relative;overflow:hidden;
  }
  .shimmer-btn::after{
    content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);
    transform:skewX(-18deg);animation:shimmerSweep 3.4s ease-in-out infinite;
  }

.topup-modal{
    position:fixed;
    inset:0;
    z-index:999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(3,3,8,.82);
    backdrop-filter:blur(12px);
  }
  .topup-modal.active{display:flex;}
  .topup-panel{
    width:min(100%,420px);
    max-height:90vh;
    overflow-y:auto;
    padding:20px;
    border:1px solid var(--border);
    border-radius:22px;
    background:var(--panel);
    box-shadow:0 24px 80px rgba(0,0,0,.55);
  }
  .topup-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    margin-bottom:18px;
  }
  .topup-title{
    font-size:20px;
    font-weight:800;
    font-family:'Space Grotesk',sans-serif;
  }
  .topup-subtitle{
    margin-top:5px;
    color:var(--text-dim);
    font-size:12.5px;
  }
  .topup-close{
    width:34px;
    height:34px;
    flex:0 0 34px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
    font-size:20px;
  }
  .credit-packs{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin-bottom:18px;
  }
  .credit-pack{
    padding:14px 10px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
    text-align:left;
    transition:.18s ease;
  }
  .credit-pack:hover,
  .credit-pack.active{
    border-color:var(--ember-2);
    transform:translateY(-1px);
    box-shadow:0 0 0 1px rgba(139,92,246,.18);
  }
  .credit-pack strong{
    display:block;
    font-size:15px;
    font-family:'Space Grotesk',sans-serif;
  }
  .credit-pack span{
    display:block;
    margin-top:4px;
    color:var(--ember-2);
    font-size:13px;
    font-weight:700;
  }
  .topup-slider-wrap{
    padding:14px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--panel-2);
    margin-bottom:14px;
  }
  .topup-slider-label{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
    font-size:13px;
  }
  .topup-slider-label strong{
    color:var(--ember-2);
    font-family:'Space Grotesk',sans-serif;
  }
  .topup-slider{
    width:100%;
    accent-color:var(--ember-2);
    cursor:pointer;
  }
  .topup-summary{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    padding:14px;
    margin-bottom:14px;
    border:1px solid var(--border);
    border-radius:14px;
    background:rgba(139,92,246,.08);
  }
  .topup-summary span{
    color:var(--text-dim);
    font-size:12.5px;
  }
  .topup-summary strong{
    font-size:22px;
    font-family:'Space Grotesk',sans-serif;
  }
  .topup-pay-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:var(--blue-grad);
    color:#fff;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
  }



  /* MAIN */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}

  .topbar{
    height:74px;flex-shrink:0;display:flex;align-items:center;gap:18px;padding:0 32px;
    position:sticky;top:0;z-index:20;background:rgba(11,9,8,.72);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .search{
    flex:1;max-width:560px;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:11px 16px;color:var(--text-faint);font-size:14px;display:flex;align-items:center;gap:10px;
    transition:border-color .15s ease;
  }
  .search:hover{border-color:var(--border-soft);}
  .topbar-spacer{flex:1;}
  .top-ic{width:38px;height:38px;border-radius:11px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-dim);cursor:pointer;transition:transform .15s ease, border-color .15s ease;flex-shrink:0;}
  .top-ic:hover{transform:translateY(-1px);border-color:var(--border-soft);color:var(--text);}
  .user-block{display:flex;align-items:center;gap:10px;padding-left:6px;cursor:pointer;flex-shrink:0;}
  .user-meta{text-align:right;line-height:1.25;}
  .user-meta .name{font-size:13.5px;font-weight:700;}
  .user-meta .plan{font-size:11px;color:var(--ember-2);font-weight:600;}
  .avatar-sm{width:38px;height:38px;border-radius:50%;background:var(--ember-grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#ffffff;box-shadow:var(--shadow-ember);flex-shrink:0;}

  .content{flex:1;overflow-y:auto;padding:28px 32px 56px;}

  /* SCREENS */
  .screen{display:none;}
  .screen.active{display:block;animation:fadein .3s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* HERO */
  .hero{
    position:relative;border-radius:22px;padding:34px 38px;margin:0 0 28px;overflow:hidden;
    background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:32px;min-height:180px;
  }
  .hero::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(620px 260px at 92% -20%, rgba(139,92,246,.26), transparent 62%),
               radial-gradient(420px 220px at -10% 130%, rgba(15,157,117,.2), transparent 60%);
    pointer-events:none;
  }
  .hero-text{position:relative;flex:1;min-width:0;}
  .hero h1{font-size:30px;margin:0 0 8px;font-weight:700;}
  .hero p{color:var(--text-dim);margin:0 0 18px;font-size:15px;}
  .pill-row{display:flex;gap:9px;flex-wrap:wrap;}
  .pill{background:var(--panel-2);border:1px solid var(--border);padding:7px 13px;border-radius:20px;font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:6px;}

  .hero-orbit{position:relative;width:210px;height:210px;flex-shrink:0;display:none;}
  .hero-orbit .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed var(--border-soft);}
  .hero-orbit .ring.r2{inset:26px;}
  .hero-orbit .core-lg{
    position:absolute;inset:52px;border-radius:50%;background:var(--ember-grad);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px;color:#fff;
    box-shadow:0 0 50px -6px rgba(139,92,246,.65);
  }
  .orbit-ic{
    position:absolute;width:44px;height:44px;border-radius:13px;background:var(--panel-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 6px 16px -6px rgba(0,0,0,.6);
    animation:orbitBob 5s ease-in-out infinite;
  }
  .orbit-ic.o1{top:-6px;left:6px;color:#a78bfa;animation-delay:0s;}
  .orbit-ic.o2{top:-2px;right:-8px;color:#f9a8d4;animation-delay:.6s;}
  .orbit-ic.o3{bottom:6px;left:-14px;color:#4ade80;animation-delay:1.2s;}
  .orbit-ic.o4{bottom:-4px;right:2px;color:#c4b5fd;animation-delay:1.8s;}
  @keyframes orbitBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px;}
  .section-title h2{font-size:18px;margin:0;padding-left:12px;position:relative;font-weight:600;}
  .section-title h2::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:3px;background:var(--ember-grad);}
  .section-title a{color:var(--ember-2);font-size:13px;font-weight:600;}
  .section-title a:hover{text-decoration:underline;}

  /* FEATURE GRID */
  .feature-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-bottom:36px;}
  @media (max-width:1500px){.feature-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:980px){.feature-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:640px){.feature-grid{grid-template-columns:1fr;}}

  .fcard{
    background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px;
    display:flex;flex-direction:column;transition:border-color .15s ease, transform .15s ease;min-width:0;
  }
  .fcard:hover{border-color:var(--border-soft);transform:translateY(-2px);}
  .fcard.rox-ip{border-color:rgba(34,197,94,.28);}
  .fcard-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;cursor:pointer;}
  .fcard-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .fcard h3{margin:0;font-size:15px;font-weight:600;}
  .fcard p{color:var(--text-dim);font-size:12px;margin:0 0 12px;line-height:1.5;min-height:34px;}
  .fcard-thumb{height:96px;border-radius:12px;margin-bottom:12px;background-size:cover;background-position:center;position:relative;overflow:hidden;cursor:pointer;flex-shrink:0;}
  .fcard-thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;background:rgba(0,0,0,.18);}
  .fcard-thumb .play span{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;}

  /* Rox IP dotted map thumb */
  .map-thumb{
    background:
      radial-gradient(circle at 20% 35%, rgba(74,222,128,.9) 0 2px, transparent 3px),
      radial-gradient(circle at 62% 20%, rgba(74,222,128,.9) 0 2px, transparent 3px),
      radial-gradient(circle at 80% 55%, rgba(74,222,128,.9) 0 2px, transparent 3px),
      radial-gradient(circle at 38% 70%, rgba(74,222,128,.9) 0 2px, transparent 3px),
      radial-gradient(circle at 55% 82%, rgba(74,222,128,.9) 0 2px, transparent 3px),
      radial-gradient(circle at 12% 78%, rgba(74,222,128,.9) 0 2px, transparent 3px),
      linear-gradient(135deg,#04231a,#0f9d75 70%,#0b2f22);
    position:relative;
  }

  /* Chat preview thumb */
  .chat-thumb{background:var(--panel-2);border:1px solid var(--border);padding:9px 10px;display:flex;flex-direction:column;gap:6px;justify-content:center;}
  .chat-thumb .b{max-width:80%;padding:5px 9px;border-radius:9px;font-size:9.5px;line-height:1.35;}
  .chat-thumb .b.u{align-self:flex-end;background:var(--ember-grad);color:#fff;border-bottom-right-radius:3px;}
  .chat-thumb .b.a{align-self:flex-start;background:var(--panel-3);border:1px solid var(--border);border-bottom-left-radius:3px;color:var(--text-dim);}

  /* Code preview thumb */
  .code-thumb{background:#0d0c11;border:1px solid var(--border);padding:9px 11px;font-family:'SF Mono',Consolas,monospace;font-size:10px;line-height:1.6;color:#c4b5fd;overflow:hidden;}
  .code-thumb .ln{color:var(--text-faint);display:inline-block;width:14px;}
  .code-thumb .kw{color:#f9a8d4;}
  .code-thumb .fn{color:#7dd3fc;}
  .code-thumb .str{color:#86efac;}

  .fcard-form{display:flex;flex-direction:column;gap:9px;margin-top:auto;}
  .fcard-form input, .fcard-form select{
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;
    color:var(--text);font-size:12.5px;width:100%;transition:border-color .15s ease;
  }
  .fcard-form input:focus, .fcard-form select:focus{outline:none;border-color:var(--ember-2);box-shadow:0 0 0 3px rgba(167,139,250,.12);}
  .fcard-btn{
    border:none;border-radius:10px;padding:11px;font-weight:600;font-size:13px;color:#ffffff;cursor:pointer;
    width:100%;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden;
  }

  /* DASHBOARD ROW: projects + activity */
  .dashboard-row{display:flex;gap:22px;align-items:flex-start;}
  @media (max-width:1100px){.dashboard-row{flex-direction:column;}}
  .projects-col{flex:1;min-width:0;}
  .project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}
  .pcard{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;
  }
  .pcard:hover{transform:translateY(-3px);border-color:var(--border-soft);}
  .pcard .pthumb{height:110px;background-size:cover;background-position:center;position:relative;}
  .pcard .pbody{padding:12px 13px 14px;}
  .pcard .t{font-size:13px;font-weight:600;margin-bottom:3px;}
  .pcard .s{font-size:11.5px;color:var(--text-dim);}
  .pcard .s.live{color:#4ade80;}
  .pcard .pthumb.chatp{background:var(--panel-2);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px;}
  .pcard .pthumb.chatp .row{display:flex;align-items:center;gap:6px;}
  .pcard .pthumb.chatp .av{width:22px;height:22px;border-radius:50%;background:var(--ember-grad);flex-shrink:0;}
  .pcard .pthumb.chatp .ln{height:6px;border-radius:4px;background:var(--panel-3);flex:1;}
  .pcard .pthumb.codep{background:#0d0c11;padding:10px;font-family:monospace;font-size:9px;color:var(--text-faint);line-height:1.7;}

  .activity-col{width:300px;flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;}
  @media (max-width:1100px){.activity-col{width:100%;}}
  .activity-col h2{font-size:16px;margin:0 0 16px;font-weight:600;}
  .arow{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);}
  .arow:last-child{border-bottom:none;padding-bottom:0;}
  .arow:first-of-type{padding-top:0;}
  .arow .aic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .arow .abody{flex:1;min-width:0;}
  .arow .at{font-size:13px;font-weight:600;}
  .arow .as{font-size:11.5px;color:var(--text-dim);margin-top:1px;}
  .arow .atime{font-size:10.5px;color:var(--text-faint);flex-shrink:0;white-space:nowrap;}

  .project-list{display:flex;flex-direction:column;gap:10px;}
  .prow{
    display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:11px;cursor:pointer;transition:transform .15s ease, border-color .15s ease;
  }
  .prow:hover{border-color:var(--border-soft);}
  .prow .thumb{width:52px;height:52px;border-radius:10px;flex-shrink:0;background-size:cover;background-position:center;}
  .prow .t{font-size:13.5px;font-weight:600;}
  .prow .s{font-size:11.5px;color:var(--text-dim);}
  .prow .chev{margin-left:auto;color:var(--text-faint);}
/* ROX SETTINGS DESIGN START */
.rox-settings-body{
  width:100%;
  height:100%;
  overflow-y:auto;
  padding:20px;
  color:var(--text);
  scrollbar-width:thin;
  scrollbar-color:rgba(139,92,246,.45) transparent;
}

.rox-settings-body::-webkit-scrollbar{
  width:7px;
}

.rox-settings-body::-webkit-scrollbar-thumb{
  border-radius:99px;
  background:rgba(139,92,246,.42);
}

.rox-settings-hero{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:stretch;
  gap:12px;
  margin-bottom:16px;
}

.rox-settings-hero .placeholder-view{
  min-height:88px;
  margin:0 !important;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  border:1px solid rgba(139,92,246,.2);
  border-radius:18px;
  background:
    radial-gradient(circle at 80% 20%,rgba(124,58,237,.18),transparent 44%),
    linear-gradient(135deg,rgba(17,24,39,.55),rgba(30,41,59,.28));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 12px 30px rgba(2,6,23,.18);
  color:var(--text);
  text-align:center;
  line-height:1.6;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.rox-settings-hero .upgrade-btn{
  width:auto !important;
  min-width:190px;
  margin:0 !important;
  border-radius:18px;
  padding:0 20px;
}

.rox-settings-nav{
  position:sticky;
  top:0;
  z-index:25;
  display:flex;
  gap:8px;
  margin-bottom:16px;
  padding:8px;
  overflow-x:auto;
  border:1px solid rgba(255,255,255,.07);

  background:rgba(12,17,30,.76);

    inset 0 1px 0 rgba(255,255,255,.05),

  scrollbar-width:none;

.rox-settings-nav::-webkit-scrollbar{

}

.rox-settings-nav button{
  flex:0 0 auto;
  min-height:38px;
  padding:0 14px;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  color:var(--text-dim);
  cursor:pointer;
  font:inherit;
  font-size:12px;
  font-weight:750;
  white-space:nowrap;
  transition:
    color .18s ease,
    background .18s ease,
    border-color .18s ease,
    transform .18s ease;
}

.rox-settings-nav button:hover{
  color:var(--text);
  background:rgba(139,92,246,.1);
}

.rox-settings-nav button:active{
  transform:translateY(1px);
}

.rox-settings-nav button.is-active{
  border-color:rgba(139,92,246,.35);
  background:
    linear-gradient(135deg,rgba(124,58,237,.3),rgba(37,99,235,.18));
  color:#fff;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 0 22px rgba(124,58,237,.12);
}

.rox-settings-sections{
  padding-bottom:22px;
}

.rox-settings-section{
  position:relative;
  overflow:hidden;
  padding:18px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:21px;
  background:
    radial-gradient(circle at 100% 0%,rgba(99,102,241,.1),transparent 38%),
    linear-gradient(150deg,rgba(17,24,39,.72),rgba(12,18,31,.58));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 18px 42px rgba(2,6,23,.18);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  animation:roxSettingsSectionIn .2s ease-out;
}

.rox-settings-section[hidden]{
  display:none !important;
}

@keyframes roxSettingsSectionIn{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.rox-settings-heading{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:16px;
  padding-bottom:15px;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.rox-settings-heading > span{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:grid;
  place-items:center;
  border:1px solid rgba(167,139,250,.22);
  border-radius:14px;
  background:
    linear-gradient(135deg,rgba(124,58,237,.3),rgba(14,165,233,.18));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 0 24px rgba(124,58,237,.12);

  .placeholder-view{color:var(--text-dim);font-size:13.5px;padding:44px 20px;text-align:center;border:1px dashed var(--border);border-radius:16px;}

  /* â•â•â•â•â•â•â•â•â•â•â• MODALS (feature chats) â•â•â•â•â•â•â•â•â•â•â• */
  .modal-backdrop{position:fixed;inset:0;background:rgba(5,4,3,.72);backdrop-filter:blur(4px);z-index:60;display:none;align-items:center;justify-content:center;padding:32px;}

    width:100%;max-width:640px;height:min(680px,86vh);background:var(--bg);border:1px solid var(--border);
    border-radius:20px;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;position:relative;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.7);animation:modalIn .22s cubic-bezier(.16,1,.3,1);
  }
  @keyframes modalIn{from{transform:translateY(14px) scale(.98);opacity:0;}to{transform:none;opacity:1;}}
  .feature-screen::before,.feature-screen::after{
    content:'';position:absolute;width:60vmax;height:60vmax;border-radius:50%;
    filter:blur(70px);opacity:.35;z-index:-1;pointer-events:none;
  }
  .feature-screen::before{top:-18vmax;right:-20vmax;background:radial-gradient(circle at center, var(--ember-1), transparent 65%);}
  .feature-screen::after{bottom:-18vmax;left:-18vmax;background:radial-gradient(circle at center, #0f766e, transparent 65%);}

async function initAuth() {
  if (CONFIG_MISSING) {
    // Still show the login screen (so the demo login 777/19 remains
    // usable) but don't attempt real Supabase calls with a fake key.
    showLogin();
    setLoginError('Supabase configuration is missing. Add the public anon key.');
    return;
  }

  supa.auth.onAuthStateChange(handleRoxAuthStateChange);

  const { data } = await supa.auth.getSession();
  const recoveryState = getRoxRecoveryState();

  if (recoveryState.active) {
    showLogin();

    setTimeout(() => {
      openRoxRecoveryScreen(recoveryState);
    }, 0);
  } else if (data.session) {
    await onLoggedIn(data.session);
  } else {
    showLogin();
  }

}

let roxRecoveryReady = false;
let roxRecoverySession = null;

function getRoxRecoveryState() {
  const query =
    new URLSearchParams(window.location.search);

  const hash =
    new URLSearchParams(
      window.location.hash.replace(/^#/, '')
    );

  const errorCode =
    query.get('error_code') ||
    hash.get('error_code') ||
    '';

  const description =
    query.get('error_description') ||
    hash.get('error_description') ||
    '';

  const type =
    query.get('type') ||
    hash.get('type') ||
    '';

  const expired =
    errorCode === 'otp_expired' ||
    /expired|invalid/i.test(description);

  return {
    active:
      query.get('rox_recovery') === '1' ||
      type === 'recovery' ||
      expired,
    expired,
    description
  };
}

function cleanRoxRecoveryUrl() {
  try {
    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );
  } catch (_) {}
}

function handleRoxAuthStateChange(event, s) {
  if (event === 'INITIAL_SESSION') {
    return;
  }

  if (event === 'PASSWORD_RECOVERY') {
    roxRecoveryReady = true;
    roxRecoverySession = s || null;
    session = s || null;

    showLogin();

    setTimeout(() => {
      openRoxRecoveryScreen({
        active: true,
        expired: false
      });
    }, 0);

    return;
  }

  const recoveryState =
    getRoxRecoveryState();

  if (recoveryState.active) {
    if (s) session = s;
    return;
  }

  if (s) {
    onLoggedIn(s);
  } else {
    session = null;
    profile = null;
    showLogin();
  }
}

function openRoxRecoveryScreen(
  state = getRoxRecoveryState()
) {
  const modal =
    ensureRoxRecoveryScreen();

  const form =
    modal.querySelector(
      '#roxRecoveryForm'
    );

  const expiredBox =
    modal.querySelector(
      '#roxRecoveryExpired'
    );

  const title =
    modal.querySelector(
      '#roxRecoveryTitle'
    );

  const subtitle =
    modal.querySelector(
      '#roxRecoverySubtitle'
    );

  const newLabel =
    modal.querySelector(
      '#roxRecoveryNewLabel'
    );

  const confirmLabel =
    modal.querySelector(
      '#roxRecoveryConfirmLabel'
    );

  const newPassword =
    modal.querySelector(
      '#roxRecoveryNewPassword'
    );

  const confirmPassword =
    modal.querySelector(
      '#roxRecoveryConfirmPassword'
    );

  const status =
    modal.querySelector(
      '#roxRecoveryStatus'
    );

  const save =
    modal.querySelector(
      '#roxRecoverySave'
    );

  const expiredMessage =
    modal.querySelector(
      '#roxRecoveryExpiredMessage'
    );

  const resend =
    modal.querySelector(
      '#roxRecoveryResend'
    );

  title.textContent =
    state.expired
      ? roxT(
          'auth.recoveryExpiredTitle'
        )
      : roxT(
          'auth.chooseNewPasswordTitle'
        );

  subtitle.textContent =
    state.expired
      ? roxT(
          'auth.recoveryExpiredSubtitle'
        )
      : roxT(
          'auth.chooseNewPasswordSubtitle'
        );

  newLabel.textContent =
    roxT('auth.newPassword');

  confirmLabel.textContent =
    roxT('auth.confirmPassword');

  save.textContent =
    roxT(
      'auth.updateRecoveryPassword'
    );

  resend.textContent =
    roxT(
      'auth.requestNewRecoveryLink'
    );

  if (newPassword) {
    newPassword.placeholder =
      roxT('auth.newPassword');

    newPassword.value = '';
  }

  if (confirmPassword) {
    confirmPassword.placeholder =
      roxT('auth.confirmPassword');

    confirmPassword.value = '';
  }

  if (state.expired) {
    form.style.display = 'none';
    expiredBox.style.display =
      'block';

    expiredMessage.textContent =
      roxT(
        'auth.recoveryExpiredMessage'
      );
  } else {
    form.style.display = 'block';
    expiredBox.style.display =
      'none';

    status.className =
      'rox-recovery-status';

    if (roxRecoveryReady) {
      status.textContent = '';
      save.disabled = false;

      setTimeout(
        () => newPassword?.focus(),
        40
      );
    } else {
      status.textContent =
        roxT(
          'auth.verifyingRecoveryLink'
        );

      save.disabled = true;
    }
  }

  document
    .getElementById('login-overlay')
    ?.classList.remove('hidden');

  modal.classList.add('active');

  modal.setAttribute(
    'aria-hidden',
    'false'
  );
}
function ensureRoxForgotPasswordModal() {
  let modal = document.getElementById('roxForgotPasswordModal');
  if (modal) return modal;

  modal = document.createElement('div');
  modal.id = 'roxForgotPasswordModal';
  modal.className = 'rox-forgot-modal';
  modal.setAttribute('aria-hidden', 'true');

  modal.innerHTML = `
    <div class="rox-forgot-panel" role="dialog" aria-modal="true">
      <button type="button" class="rox-forgot-close" id="roxForgotClose" aria-label="Close">Ã—</button>

      <div class="rox-forgot-title" data-i18n="auth.resetPasswordTitle">${roxT('auth.resetPasswordTitle')}</div>
      <div class="rox-forgot-subtitle" data-i18n="auth.resetPasswordSubtitle">${roxT('auth.resetPasswordSubtitle')}</div>
      <input
        class="rox-forgot-field"
        id="roxForgotEmail"
        type="email"
        autocomplete="email"
        required
        data-i18n-placeholder="auth.email"
        placeholder="${roxT('auth.email')}"
      >
      <div class="rox-forgot-status" id="roxForgotStatus" aria-live="polite"></div>
      <button type="button" class="rox-forgot-send" id="roxForgotSend" data-i18n="auth.sendRecoveryLink">${roxT('auth.sendRecoveryLink')}</button>
    </div>
  `;

  document.body.appendChild(modal);
  translateRoxUi(modal);

  const close = () => {
    if (modal.dataset.busy === 'true') return;
    modal.classList.remove('active');
    modal.setAttribute('aria-hidden', 'true');
  };

  modal.querySelector('#roxForgotClose')?.addEventListener('click', close);

  modal.addEventListener('click', event => {
    if (event.target === modal) close();
  });

  const emailInput = modal.querySelector('#roxForgotEmail');
  const sendButton = modal.querySelector('#roxForgotSend');
  const status = modal.querySelector('#roxForgotStatus');

  const setStatus = (message, type = '') => {
    status.textContent = message || '';
    status.className = `rox-forgot-status ${type}`.trim();
  };

  sendButton?.addEventListener('click', async () => {
    const email = emailInput?.value.trim() || '';

    if (!email || !emailInput.checkValidity()) {
      setStatus(roxT('auth.invalidEmail'), 'error');
      emailInput?.focus();
      return;
    }

    modal.dataset.busy = 'true';
    sendButton.disabled = true;
    sendButton.textContent = roxT('auth.sendingRecoveryLink');
    setStatus('');

    try {
      const { error } = await supa.auth.resetPasswordForEmail(
        email,
        { redirectTo: `${window.location.origin}/?rox_recovery=1` }
      );

      if (error) throw error;

      setStatus(roxT('auth.recoveryEmailSent'), 'success');
    } catch (error) {
      console.error('[auth] password recovery email failed:', error);
      setStatus(roxT('auth.recoverySendFailed'), 'error');
    } finally {
      modal.dataset.busy = 'false';
      sendButton.disabled = false;
      sendButton.textContent = roxT('auth.sendRecoveryLink');
    }
  });

  emailInput?.addEventListener('keydown', event => {
    if (event.key === 'Enter') sendButton?.click();
  });

  return modal;
}

  document.body.appendChild(modal);

  const closeModal = () => {
    if (modal.dataset.busy === 'true') return;

    modal.classList.remove('active');
    modal.setAttribute('aria-hidden', 'true');

    const newPassword =
      modal.querySelector('#roxNewPassword');

    const confirmPassword =
      modal.querySelector('#roxConfirmPassword');

    const status =
      modal.querySelector('#roxPasswordStatus');

    if (newPassword) {
      newPassword.value = '';
      newPassword.type = 'password';
    }

    if (confirmPassword) {
      confirmPassword.value = '';
      confirmPassword.type = 'password';
    }

    if (status) {
      status.textContent = '';
      status.className = 'rox-password-status';
    }
  };

  document
    .getElementById('roxPasswordClose')
    ?.addEventListener('click', closeModal);

  document
    .getElementById('roxPasswordCancel')
    ?.addEventListener('click', closeModal);

  modal.addEventListener('click', event => {
    if (event.target === modal) {
      closeModal();
    }
  });

  document.addEventListener('keydown', event => {
    if (
      event.key === 'Escape' &&
      modal.classList.contains('active')
    ) {
      closeModal();
    }
  });

  modal
    .querySelectorAll('[data-password-toggle]')
    .forEach(button => {
      button.addEventListener('click', () => {
        const input =
          document.getElementById(
            button.dataset.passwordToggle
          );

        if (!input) return;

        const show =
          input.type === 'password';

        input.type =
          show ? 'text' : 'password';

        button.textContent =
          show ? 'â—Œ' : 'â—‰';

        button.setAttribute(
          'aria-label',
          show ? 'Hide password' : 'Show password'
        );
      });
    });

  document
    .getElementById('roxPasswordSave')
    ?.addEventListener('click', async () => {
      const currentPassword =
        modal.querySelector('#roxCurrentPassword');

      const newPassword =
        modal.querySelector('#roxNewPassword');

      const confirmPassword =
        modal.querySelector('#roxConfirmPassword');

      const status =
        modal.querySelector('#roxPasswordStatus');

      const save =
        modal.querySelector('#roxPasswordSave');

      const current =
        currentPassword?.value || '';

      const password =
        newPassword?.value || '';

      const confirmation =
        confirmPassword?.value || '';

      const setStatus = (message, type = '') => {
        if (!status) return;

        status.textContent = message;
        status.className =
          `rox-password-status ${type}`.trim();
      };

      if (!current) {
        setStatus(
          'Enter your current password.',
          'error'
        );
        currentPassword?.focus();
        return;
      }

      if (password.length < 8) {
        setStatus(
          'Password must contain at least 8 characters.',
          'error'
        );
        newPassword?.focus();
        return;
      }

      if (password !== confirmation) {
        setStatus(
          'Passwords do not match.',
          'error'
        );
        confirmPassword?.focus();
        return;
      }

      if (!session || !session.user) {
        setStatus(
          'Please sign in again before changing your password.',
          'error'
        );
        return;
      }

      modal.dataset.busy = 'true';

      if (save) {
        save.disabled = true;
        save.textContent = 'Updating...';
      }

      setStatus('');

      try {
        const { error } =
          await supa.auth.updateUser({
            password,
            current_password: current
          });

        if (error) throw error;

        setStatus(
          'âœ“ Password updated successfully.',
          'success'
        );

        if (save) {
          save.textContent = 'âœ“ Updated';
        }

        setTimeout(() => {
          modal.dataset.busy = 'false';

          if (save) {
            save.disabled = false;
            save.textContent = 'Update password';
          }

          closeModal();
        }, 1300);
      } catch (error) {
        console.error(
          '[settings] password update failed:',
          error
        );

        modal.dataset.busy = 'false';

        if (save) {
          save.disabled = false;
          save.textContent = 'Update password';
        }

        setStatus(
          error?.message ||
            'Unable to update password.',
          'error'
        );
      }
    });

  return modal;
}

// â”€â”€ profile / credits â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
async function refreshProfile() {
  if (!session) return;
  const { data, error } = await supa
    .from('profiles')
    .select('email, full_name, credits_used, credits_total, subscription_status')
    .eq('id', session.user.id)
    .single();
  if (error) { console.error('[profile] load failed:', error.message); return; }
  profile = data;
  renderProfile();

  // Always fetch from the backend (not just the raw Supabase row) â€”
  // /api/usage-status is what actually matches what the server enforces
  // for both tiers now that Pro also draws from a real 500-credit/month
  // pool (no more unconditional 'pro' bypass â€” see gatekeeper.js).
  try {
    const res = await authFetch('/api/usage-status', { method: 'GET' });
    const usage = await res.json();
    if (usage.status !== 'success') return;
    if (usage.isPro) {
      renderProUsage(usage.creditsUsed, usage.creditsTotal, usage.creditsRemaining);
    } else {
      renderDailyUsage(usage.dailyChatUsed, usage.dailyChatLimit);
    }
  } catch (e) { console.error('[usage-status] load failed:', e); }
}

function renderDailyUsage(used, limit) {
  lastRoxUsage = { type: 'daily', used, limit };
  const pct = Math.min(100, Math.round((used / limit) * 100));
  document.getElementById('sidebarUsagePct').textContent = pct + '%';
  document.getElementById('sidebarUsageFill').style.width = pct + '%';
  document.getElementById('sidebarCreditsNum').textContent =
    roxT('usage.dailyMessages', { used, limit });
  document.getElementById('settingsSummary').textContent =
    roxT('usage.freeSummary', { used, limit });
  document.getElementById('topupBtn').style.display = 'block';
}

function renderProUsage(used, total, remaining) {
  lastRoxUsage = { type: 'pro', used, total, remaining };
  const pct = Math.min(100, Math.round((used / total) * 100));
  document.getElementById('sidebarUsagePct').textContent = pct + '%';
  document.getElementById('sidebarUsageFill').style.width = pct + '%';
  document.getElementById('sidebarCreditsNum').textContent =
    roxT('usage.proCredits', { used, total, remaining });
  document.getElementById('settingsSummary').textContent =
    roxT('usage.proSummary', { used, total, remaining });
  // Surface the top-up option proactively once the pool is getting low,
  // not only after they've already hit a hard block mid-message.
  document.getElementById('topupBtn').style.display = 'block';
}

function renderProfile() {
  if (!profile) return;
  const initial = (profile.full_name || profile.email || '?').charAt(0).toUpperCase();
  const displayName = profile.full_name || profile.email.split('@')[0];
  const isPro = profile.subscription_status === 'pro';

  document.getElementById('userAvatar').textContent = initial;
  document.getElementById('topbarUserName').textContent = displayName;
  document.getElementById('topbarUserPlan').textContent = isPro ? roxT('settings.account.planPro') : roxT('settings.account.planFree');

  const sidebarProfileAvatar =
    document.getElementById('sidebarProfileAvatar');

  const sidebarProfileName =
    document.getElementById('sidebarProfileName');

  const sidebarProfilePlan =
    document.getElementById('sidebarProfilePlan');

  if (sidebarProfileAvatar) {
    sidebarProfileAvatar.textContent = initial;
  }

  if (sidebarProfileName) {
    sidebarProfileName.textContent = displayName;
  }

  if (sidebarProfilePlan) {
    sidebarProfilePlan.textContent =
      isPro
        ? roxT('settings.account.planPro')
        : roxT('settings.account.planFree');
  }
  document.getElementById('heroGreeting').textContent = roxT('home.greetingName', { name: displayName });

  // Overwritten right after by renderProUsage()/renderDailyUsage() once
  // /api/usage-status responds â€” this is just the safe initial state.
  document.getElementById('sidebarUsagePct').textContent = 'â€¦';
  document.getElementById('sidebarUsageFill').style.width = '0%';
  document.getElementById('sidebarCreditsNum').textContent = 'â€¦';

  document.getElementById('upgradeBtn').style.display = isPro ? 'none' : 'block';
  document.getElementById('settingsUpgradeBtn').style.display = isPro ? 'none' : 'block';
}

async function handleUpgrade() {
  if (!session) { showLogin(); return; }
  try {
    const res = await authFetch('/api/create-checkout-session', { method: 'POST' });
    const data = await res.json();
    if (data.url) window.location.href = data.url;
  } catch (err) {
    console.error('[upgrade] failed:', err.message);
  }
}

// TOPUP_PRICE_PER_CREDIT must match backend/createTopupSession.js
// (TOPUP_PRICE_PER_CREDIT_USD, default $0.02/credit).
const TOPUP_PRICE_PER_CREDIT = 0.01;

let selectedTopupCredits = 1000;

function setTopupCredits(value) {
  const credits = Math.min(
    10000,
    Math.max(1000, Math.round(Number(value) / 1000) * 1000)
  );

  selectedTopupCredits = credits;

  document.getElementById('topupSlider').value = String(credits);
  document.getElementById('topupCreditsValue').textContent = credits.toLocaleString();
  document.getElementById('topupSummaryCredits').textContent =
    roxT('topup.creditsAmount', { count: credits.toLocaleString() });
  const topupPriceUsd =
    credits >= 5000
      ? credits * 0.008
      : credits * TOPUP_PRICE_PER_CREDIT;

  document.getElementById('topupSummaryPrice').textContent =
    `$${topupPriceUsd.toFixed(2)}`;

  document.querySelectorAll('.credit-pack').forEach(pack => {
    pack.classList.toggle(
      'active',
      Number(pack.dataset.credits) === credits
    );
  });
}

function handleTopup() {
  if (!session) {
    showLogin();
    return;
  }

  setTopupCredits(1000);
  document.getElementById('topupModal').classList.add('active');
}

function closeTopupModal() {
  document.getElementById('topupModal').classList.remove('active');
}

async function submitTopupPayment() {
  const payButton = document.getElementById('topupPayBtn');
  payButton.disabled = true;
  payButton.textContent = roxT('topup.opening');

  try {
    const res = await authFetch('/api/create-topup-session', {
      method: 'POST',
      body: JSON.stringify({
        credits: selectedTopupCredits
      }),
    });

    const data = await res.json();

    if (data.url) {
      window.location.href = data.url;
      return;
    }

    alert(data.message || roxT('topup.paymentError'));
  } catch (err) {
    console.error('[topup] failed:', err.message);
    alert(roxT('topup.paymentError'));
  } finally {
    payButton.disabled = false;
    payButton.textContent = roxT('topup.continue');
  }
}

function getRoxUiLanguage() {
  const selectedLanguage =
    localStorage.getItem(
      ROX_SETTINGS_KEYS.uiLanguage
    ) || 'auto';

  const resolvedLanguage =
    resolveRoxUiLanguage(selectedLanguage);

  return ROX_UI_LANGUAGES.includes(
    resolvedLanguage
  )
    ? resolvedLanguage
    : 'en';
}

function roxT(key, variables = {}) {
  const language = getRoxUiLanguage();

  const translatedText =
    ROX_I18N[language]?.[key] ??
    ROX_I18N.en?.[key] ??
    key;

  return Object.entries(variables).reduce(
    (result, [variableName, value]) =>
      result.replaceAll(
        `{{${variableName}}}`,
        String(value)
      ),
    translatedText
  );
}

function roxTForLanguage(language, key, variables = {}) {
  const selectedLanguage =
    ROX_UI_LANGUAGES.includes(language)
      ? language
      : 'en';

  const translatedText =
    ROX_I18N[selectedLanguage]?.[key] ??
    ROX_I18N.en?.[key] ??
    key;

  return Object.entries(variables).reduce(
    (result, [variableName, value]) =>
      result.replaceAll(
        `{{${variableName}}}`,
        String(value)
      ),
    translatedText
  );
}

function translateRoxUi(root = document) {
  root
    .querySelectorAll('[data-i18n]')
    .forEach(element => {
      const key = element.dataset.i18n;

      if (key) {
        element.textContent = roxT(key);
      }
    });

  root
    .querySelectorAll('[data-i18n-placeholder]')
    .forEach(element => {
      const key =
        element.dataset.i18nPlaceholder;

      if (key) {
        element.setAttribute(
          'placeholder',
          roxT(key)
        );
      }
    });

  root
    .querySelectorAll('[data-i18n-title]')
    .forEach(element => {
      const key =
        element.dataset.i18nTitle;

      if (key) {
        element.setAttribute(
          'title',
          roxT(key)
        );
      }
    });

  root
    .querySelectorAll('[data-i18n-aria-label]')
    .forEach(element => {
      const key =
        element.dataset.i18nAriaLabel;

      if (key) {
        element.setAttribute(
          'aria-label',
          roxT(key)
        );
      }
    });

  root
    .querySelectorAll('[data-i18n-html]')
    .forEach(element => {
      const key = element.dataset.i18nHtml;

      if (key) {
        element.innerHTML = roxT(key);
      }
    });
}

function syncRoxDynamicUi() {
  const loginSubmit =
    document.getElementById('login-submit');
  const loginToggle =
    document.getElementById('login-toggle');

  if (loginSubmit) {
    loginSubmit.textContent = isSignupMode
      ? roxT('auth.createAccount')
      : roxT('auth.signIn');
  }

  if (loginToggle) {
    loginToggle.innerHTML = isSignupMode
      ? roxT('auth.haveAccountHtml')
      : roxT('auth.noAccountHtml');
  }

  if (profile) {
    const displayName =
      profile.full_name ||
      profile.email?.split('@')[0] ||
      '';

    const greeting =
      document.getElementById('heroGreeting');

    if (greeting) {
      greeting.textContent =
        roxT('home.greetingName', {
          name: displayName
        });
    }

    const topbarPlan =
      document.getElementById('topbarUserPlan');

    if (topbarPlan) {
      topbarPlan.textContent =
        profile.subscription_status === 'pro'
          ? roxT('settings.account.planPro')
          : roxT('settings.account.planFree');
    }
  }

  if (lastRoxUsage?.type === 'daily') {
    renderDailyUsage(
      lastRoxUsage.used,
      lastRoxUsage.limit
    );
  } else if (lastRoxUsage?.type === 'pro') {
    renderProUsage(
      lastRoxUsage.used,
      lastRoxUsage.total,
      lastRoxUsage.remaining
    );
  }

  if (
    typeof selectedTopupCredits !== 'undefined' &&
    document.getElementById('topupSlider')
  ) {
    setTopupCredits(selectedTopupCredits);
  }
}

function getRoxBooleanSetting(key, fallback = false) {
  const value = localStorage.getItem(key);

  if (value === null) {
    return fallback;
  }

  return value === 'true';
}

function setRoxBooleanSetting(key, value) {
  localStorage.setItem(
    key,
    String(Boolean(value))
  );
}

function getRoxSystemTheme() {
  return window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: light)').matches
      ? 'light'
      : 'dark';
}

function applyRoxTheme(themeValue) {
  const selectedTheme =
    themeValue || 'system';

  const resolvedTheme =
    selectedTheme === 'system'
      ? getRoxSystemTheme()
      : selectedTheme;

  document.documentElement.dataset.roxTheme =
    resolvedTheme;

  document.documentElement.dataset.roxThemePreference =
    selectedTheme;
}

function applyRoxDensity(densityValue) {
  document.documentElement.dataset.roxDensity =
    densityValue === 'compact'
      ? 'compact'
      : 'comfortable';
}

function resolveRoxUiLanguage(languageValue) {
  if (
    languageValue &&
    languageValue !== 'auto'
  ) {
    return languageValue;
  }

  return (
    navigator.languages &&
    navigator.languages[0]
      ? navigator.languages[0]
      : navigator.language || 'fr'
  ).split('-')[0];
}

function applyRoxUiLanguage(languageValue) {
  const resolvedLanguage =
    resolveRoxUiLanguage(languageValue);

  document.documentElement.lang =
    resolvedLanguage;

  document.documentElement.dir =
    resolvedLanguage === 'ar'
      ? 'rtl'
      : 'ltr';

  document.documentElement.dataset.roxUiLanguage =
    resolvedLanguage;


  translateRoxUi();
  syncRoxSettingsAccount();
  syncRoxDynamicUi();
}

function getRoxSpeechRate() {
  const savedRate = Number(
    localStorage.getItem(
      ROX_SETTINGS_KEYS.voiceRate
    )
  );

  if (
    Number.isFinite(savedRate) &&
    savedRate >= 0.75 &&
    savedRate <= 1.5
  ) {
    return savedRate;
  }

  return 1;
}

function getRoxSelectedVoice(voices) {
  const selectedVoiceId =
    localStorage.getItem(
      ROX_SETTINGS_KEYS.voiceName
    );

  if (!selectedVoiceId) {
    return null;
  }

  return voices.find(
    voice =>
      voice.voiceURI === selectedVoiceId ||
      voice.name === selectedVoiceId
  ) || null;
}

function speakRoxText(text) {
  if (
    !text ||
    !('speechSynthesis' in window)
  ) {
    return;
  }

  const speech =
    new SpeechSynthesisUtterance(
      String(text)
    );

  const selectedLanguage =
    localStorage.getItem(
      'roxVoiceLanguage'
    );

  const isArabic =
    /[\u0600-\u06FF]/.test(
      String(text)
    );

  const preferredLang =
    selectedLanguage ||
    (
      isArabic
        ? 'ar-MA'
        : (
            document.documentElement.lang ||
            navigator.language ||
            'fr-FR'
          )
    );

  speech.lang = preferredLang;
  speech.rate = getRoxSpeechRate();
  speech.pitch = 1;
  speech.volume = 1;

  const voices =
    window.speechSynthesis.getVoices();

  const selectedVoice =
    getRoxSelectedVoice(voices);

  const exactVoice = voices.find(
    voice =>
      voice.lang.toLowerCase() ===
      preferredLang.toLowerCase()
  );

  const languageVoice = voices.find(
    voice =>
      voice.lang.toLowerCase().startsWith(
        preferredLang
          .toLowerCase()
          .split('-')[0]
      )
  );

  speech.voice =
    selectedVoice ||
    exactVoice ||
    languageVoice ||
    null;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);
}

function maybeAutoReadRoxMessage(text) {
  if (
    !getRoxBooleanSetting(
      ROX_SETTINGS_KEYS.autoRead,
      false
    )
  ) {
    return;
  }

  speakRoxText(text);
}

function populateRoxSettingsVoiceLanguages() {
  const select =
    document.getElementById(
      'settingsVoiceLanguage'
    );

  if (
    !select ||
    typeof voiceLanguages === 'undefined'
  ) {
    return;
  }

  select.innerHTML = '';

  voiceLanguages.forEach(
    ([value, label]) => {
      const option =
        document.createElement('option');

      option.value = value;
      option.textContent = label;

      select.appendChild(option);
    }
  );

  select.value =
    localStorage.getItem(
      'roxVoiceLanguage'
    ) || '';
}

function populateRoxSettingsVoices() {
  const select =
    document.getElementById(
      'settingsVoiceName'
    );

  if (
    !select ||
    !('speechSynthesis' in window)
  ) {
    return;
  }

  const previousValue =
    localStorage.getItem(
      ROX_SETTINGS_KEYS.voiceName
    ) || '';

  const voices =
    window.speechSynthesis
      .getVoices()
      .slice()
      .sort((a, b) =>
        `${a.lang} ${a.name}`.localeCompare(
          `${b.lang} ${b.name}`
        )
      );

  select.innerHTML = '';

  const automaticOption =
    document.createElement('option');

  automaticOption.value = '';
  automaticOption.textContent =
    'Automatique';

  select.appendChild(
    automaticOption
  );

  voices.forEach(voice => {
    const option =
      document.createElement('option');

    option.value =
      voice.voiceURI || voice.name;

    option.textContent =
      `${voice.name} â€” ${voice.lang}`;

    select.appendChild(option);
  });

  select.value = voices.some(
    voice =>
      voice.voiceURI === previousValue ||
      voice.name === previousValue
  )
    ? previousValue
    : '';
}

function scheduleRoxStartPage() {
  if (!session) {
    return;
  }

  const startPage =
    localStorage.getItem(
      ROX_SETTINGS_KEYS.startPage
    ) || 'home';

  const userId =
    session.user?.id || 'current';

  const sessionKey =
    `roxStartPageOpened:${userId}`;

  if (
    sessionStorage.getItem(sessionKey)
  ) {
    return;
  }

  sessionStorage.setItem(
    sessionKey,
    'true'
  );

  setTimeout(() => {
    if (startPage === 'home') {
      document
        .querySelector('[data-tab="home"]')
        ?.click();

      return;
    }

    document
      .querySelector(
        `[data-open="${startPage}"]`
      )
      ?.click();
  }, 250);
}

// â”€â”€ authenticated fetch helper â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const getBackendUnavailableMessage = () =>
  roxT('config.backendUnavailable');

async function authFetch(path, options = {}) {
  if (!session) { showLogin(); throw new Error('not_authenticated'); }
  if (session.access_token === DEMO_TOKEN) return demoFetch(path, options);

  let res;
  try {
    res = await fetch(CONFIG.API_BASE + path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${session.access_token}`,
        ...(options.headers || {}),
      },
    });
  } catch (networkErr) {
    // fetch() throws (TypeError: Failed to fetch) when the backend is
    // down/unreachable â€” surface that clearly instead of a generic error.
    console.error('[authFetch] backend unreachable:', networkErr.message);
    showConfigBanner(getBackendUnavailableMessage());
    throw new Error('backend_unavailable');
  }

  if (res.status === 401) {
    await supa.auth.signOut();
    showLogin();
    throw new Error('session_expired');
  }
  return res;
}

// â”€â”€ conversation history (per feature: 'chat' / 'code') â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// Previously each call to /api/chat sent only the current message
// (`messages: [{role:'user', content:text}]`), so the model had no
// memory of anything said earlier in the same session even though the
// backend (lib/inputValidation.js) already supports a full history up
// to MAX_MESSAGES_PER_CHAT (40). Kept in memory only (cleared on page
// reload) â€” no browser storage involved.
const CHAT_HISTORY_LIMIT = 40; // mirrors backend MAX_MESSAGES_PER_CHAT default
const conversations = { chat: [], code: [] };

function pushHistory(feature, role, content) {
  const hist = conversations[feature];
  if (!hist) return;
  hist.push({ role, content });
  if (hist.length > CHAT_HISTORY_LIMIT) hist.splice(0, hist.length - CHAT_HISTORY_LIMIT);
}

// â”€â”€ message rendering helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function appendMsg(msgBox, cls, content, isNode, meta = {}) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;

  if (isNode) {
    el.appendChild(content);
  } else {
    el.textContent = content;
  }

  msgBox.appendChild(el);

  const isBotMessage = String(cls)
    .split(/\s+/)
    .includes('bot');

  if (isBotMessage) {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    const showFeedback = (message) => {
      let note = actions.nextElementSibling;

      if (!note || !note.classList.contains('msg-feedback')) {
        note = document.createElement('div');
        note.className = 'msg-feedback';
        actions.insertAdjacentElement('afterend', note);
      }

      note.textContent = message;
      note.classList.add('show');

      clearTimeout(note._hideTimer);
      note._hideTimer = setTimeout(() => {
        note.classList.remove('show');
      }, 1600);
    };

    // ROX SAVE FEEDBACK START
    const saveFeedback = async (rating) => {
      if (!meta.responseId) {
        showFeedback(
          roxT('feedback.newResponsesOnly')
        );
        return false;
      }

      try {
        const response = await authFetch('/api/chat-feedback', {
          method: 'POST',
          body: JSON.stringify({
            responseId: meta.responseId,
            rating,
            model: meta.model || null,
            feature: meta.feature || 'chat'
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.message || 'feedback_save_failed'
          );
        }

        return true;
      } catch (error) {
        console.error(
          'ROX AI feedback save failed:',
          error
        );

        showFeedback(
          roxT('feedback.saveFailed')
        );

        return false;
      }
    };
    // ROX SAVE FEEDBACK END
    const getMessageText = () =>
      (el.innerText || el.textContent || '').trim();

    const makeAction = (symbol, titleKey, handler) => {
      const button = document.createElement('button');
      const title = roxT(titleKey);

      button.type = 'button';
      button.className = 'msg-action';
      button.textContent = symbol;
      button.title = title;
      button.setAttribute('aria-label', title);
      button.dataset.i18nTitle = titleKey;
      button.dataset.i18nAriaLabel = titleKey;

      button.addEventListener('click', async () => {
        try {
          await handler(button);
        } catch (error) {
          console.error('ROX AI message action failed:', error);
        }
      });

      actions.appendChild(button);
      return button;
    };

    const copyText = async (text) => {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    };

    makeAction('\u2398', 'feedback.copy', async (button) => {
      const text = getMessageText();
      if (!text) return;

      await copyText(text);

      const oldSymbol = button.textContent;
      button.textContent = '\u2713';

      setTimeout(() => {
        button.textContent = oldSymbol;
      }, 1200);
    });

    makeAction('\uD83D\uDD0A', 'feedback.listen', (button) => {
      if (!('speechSynthesis' in window)) return;

      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        button.classList.remove('is-active');
        return;
      }

      const text = getMessageText();
      if (!text) return;

      const speech = new SpeechSynthesisUtterance(text);
      const isArabic = /[\u0600-\u06FF]/.test(text);

      const preferredLang = isArabic
        ? 'ar-MA'
        : (document.documentElement.lang ||
           navigator.language ||
           'fr-FR');

      speech.lang = preferredLang;
      speech.rate = getRoxSpeechRate();
      speech.pitch = 1;
      speech.volume = 1;

      const voices = window.speechSynthesis.getVoices();

      const exactVoice = voices.find(
        voice =>
          voice.lang.toLowerCase() === preferredLang.toLowerCase()
      );

      const arabicVoice = isArabic
        ? voices.find(voice => /^ar(-|$)/i.test(voice.lang))
        : null;

      const languageVoice = voices.find(
        voice =>
          voice.lang.toLowerCase().startsWith(
            preferredLang.toLowerCase().split('-')[0]
          )
      );

      const savedVoice =
        getRoxSelectedVoice(voices);

      const selectedVoice =
        savedVoice ||
        exactVoice ||
        arabicVoice ||
        languageVoice;

      if (selectedVoice) {
        speech.voice = selectedVoice;
      }

      button.classList.add('is-active');

      const stopActiveState = () => {
        button.classList.remove('is-active');
      };

      speech.onend = stopActiveState;
      speech.onerror = stopActiveState;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(speech);
    });

    let likeButton;
    let dislikeButton;

    likeButton = makeAction('\uD83D\uDC4D', 'feedback.like', async (button) => {
      const nowActive =
        !button.classList.contains('is-active');

      const rating = nowActive ? 1 : 0;

      button.disabled = true;

      if (dislikeButton) {
        dislikeButton.disabled = true;
      }

      const saved = await saveFeedback(rating);

      button.disabled = false;

      if (dislikeButton) {
        dislikeButton.disabled = false;
      }

      if (!saved) return;

      button.classList.toggle(
        'is-active',
        nowActive
      );

      dislikeButton?.classList.remove('is-active');

      button.classList.add('bump');

      setTimeout(
        () => button.classList.remove('bump'),
        280
      );

      showFeedback(
        nowActive
          ? roxT('feedback.thanksLike')
          : roxT('feedback.removed')
      );
    });

    dislikeButton = makeAction('\uD83D\uDC4E', 'feedback.dislike', async (button) => {
      const nowActive =
        !button.classList.contains('is-active');

      const rating = nowActive ? -1 : 0;

      button.disabled = true;

      if (likeButton) {
        likeButton.disabled = true;
      }

      const saved = await saveFeedback(rating);

      button.disabled = false;

      if (likeButton) {
        likeButton.disabled = false;
      }

      if (!saved) return;

      button.classList.toggle(
        'is-active',
        nowActive
      );

      likeButton?.classList.remove('is-active');

      button.classList.add('bump');

      setTimeout(
        () => button.classList.remove('bump'),
        280
      );

      showFeedback(
        nowActive
          ? roxT('feedback.thanks')
          : roxT('feedback.removed')
      );
    });

    makeAction('\u2197', 'feedback.share', async () => {
      const text = getMessageText();
      if (!text) return;

      if (navigator.share) {
        await navigator.share({
          title: 'ROX AI',
          text
        });
      } else {
        await copyText(text);
      }
    });

    makeAction('\u2193', 'feedback.download', () => {
      const text = getMessageText();
      if (!text) return;

      const blob = new Blob([text], {
        type: 'text/plain;charset=utf-8'
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download = 'rox-ai-response.txt';
      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);
    });

    msgBox.appendChild(actions);
  }

  msgBox.scrollTop = msgBox.scrollHeight;
  return el;
}

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
