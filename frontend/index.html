  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:11px;
  padding:10px 16px;
  border:1px solid rgba(139,92,246,.23);
  border-radius:14px;
  background:
    linear-gradient(135deg,rgba(124,58,237,.16),rgba(37,99,235,.1));
  color:var(--text);
  cursor:pointer;
  font:inherit;
  font-size:12px;
  font-weight:750;
  transition:
    border-color .18s ease,
    background .18s ease,
    transform .18s ease,
    box-shadow .18s ease;
}

.rox-settings-action:hover{
  border-color:rgba(139,92,246,.55);
  background:
    linear-gradient(135deg,rgba(124,58,237,.28),rgba(37,99,235,.16));
  box-shadow:0 10px 24px rgba(2,6,23,.2);
}

.rox-settings-action:active{
  transform:translateY(1px);
}

.rox-settings-action.danger{
  border-color:rgba(248,113,113,.23);
  background:rgba(127,29,29,.13);

}

.rox-settings-action.danger:hover{
  border-color:rgba(248,113,113,.5);
  background:rgba(153,27,27,.22);

@media (max-width:720px){
  .rox-settings-body{
    padding:14px;
  }

  .rox-settings-hero{

  }

  }

  .rox-settings-toggle-row{
    position:relative;

  }

  }

/* ROX SETTINGS DESIGN END */

  .placeholder-view{color:var(--text-dim);font-size:13.5px;padding:44px 20px;text-align:center;border:1px dashed var(--border);border-radius:16px;}

  /* ═══════════ MODALS (feature chats) ═══════════ */
  .modal-backdrop{position:fixed;inset:0;background:rgba(5,4,3,.72);backdrop-filter:blur(4px);z-index:60;display:none;align-items:center;justify-content:center;padding:32px;}
  .modal-backdrop.active{display:flex;animation:fadein .18s ease;}
  .feature-screen{
    width:100%;max-width:640px;height:min(680px,86vh);background:var(--bg);border:1px solid var(--border);
    border-radius:20px;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;position:relative;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.7);animation:modalIn .22s cubic-bezier(.16,1,.3,1);
  }
  @keyframes modalIn{from{transform:translateY(14px) scale(.98);opacity:0;}to{transform:none;opacity:1;}}
  .feature-screen::before,.feature-screen::after{
    content:'';position:absolute;width:60vmax;height:60vmax;border-radius:50%;
    filter:blur(70px);opacity:.35;z-index:-1;pointer-events:none;
  }
  .feature-screen::before{top:-18vmax;right:-20vmax;background:radial-gradient(circle at center, var(--ember-1), transparent 65%);}
  .feature-screen::after{bottom:-18vmax;left:-18vmax;background:radial-gradient(circle at center, #0f766e, transparent 65%);}

  .modal-topbar{
    display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);
    background:rgba(22,18,16,.72);backdrop-filter:blur(14px);
  }
  .modal-topbar .back{width:36px;height:36px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;transition:transform .15s ease;}
  .modal-topbar .back:hover{transform:scale(1.05);}
  .modal-topbar .fic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .modal-topbar .meta{line-height:1.2;}
  .modal-topbar .meta .t{font-size:15px;font-weight:700;}
  .modal-topbar .meta .s{font-size:11.5px;color:var(--text-dim);}

  .chat-messages{flex:1;overflow-y:auto;padding:20px 20px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:74%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.5;animation:msgIn .22s ease;
}
  @keyframes msgIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .msg.bot{background:var(--panel-2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg-actions{
  display:flex;
  align-items:center;
  align-self:flex-start;
  gap:3px;
  margin:6px 0 9px 4px;
  padding:3px;
  width:max-content;
  max-width:100%;
  border-radius:12px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.07);
  direction:ltr;
}

.msg-action{
  width:32px;
  height:32px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:var(--text-dim);
  display:grid;
  place-items:center;
  cursor:pointer;
  font-size:16px;
  line-height:1;
  transition:transform .18s ease, background .18s ease, color .18s ease;
}

.msg-action:hover{
  background:rgba(255,255,255,.09);
  color:var(--text);
  transform:translateY(-1px);
}

.msg-action.is-active{
  background:rgba(139,92,246,.20);
  color:var(--ember-2);
}
/* ROX ACTION FEEDBACK START */
.msg-action.bump{
  animation:msgActionPop .28s ease;
}

@keyframes msgActionPop{
  0%{transform:scale(1);}
  45%{transform:scale(1.18);}
  100%{transform:scale(1);}
}

.msg-feedback{
  align-self:flex-start;
  margin:-3px 0 8px 9px;
  font-size:12px;
  color:var(--text-dim);
  opacity:0;
  transform:translateY(-4px);
  transition:opacity .2s ease, transform .2s ease;
}

.msg-feedback.show{
  opacity:1;
  transform:translateY(0);
}
/* ROX ACTION FEEDBACK END */
  .msg.user{background:var(--ember-grad);color:#ffffff;font-weight:500;align-self:flex-end;border-bottom-right-radius:4px;}
  .typing{display:flex;gap:5px;align-self:flex-start;background:var(--panel-2);border:1px solid var(--border);padding:13px 16px;border-radius:14px;border-bottom-left-radius:4px;}

  .chat-input-row{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--border);background:rgba(22,18,16,.72);backdrop-filter:blur(14px);}

    flex:1;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;

  }
  .chat-input-row input:focus{outline:none;border-color:var(--ember-2);box-shadow:0 0 0 3px rgba(167,139,250,.12);}
  .chat-input-row button{
    border:none;border-radius:12px;padding:0 20px;font-weight:600;color:#ffffff;cursor:pointer;flex-shrink:0;
    transition:transform .15s ease;
  }

// ── profile / credits ───────────────────────────────────────────────
async function refreshProfile() {
  if (!session) return;
  const { data, error } = await supa
    .from('profiles')
    .select('email, full_name, credits_used, credits_total, subscription_status')
    .eq('id', session.user.id)
    .single();
  if (error) { console.error('[profile] load failed:', error.message); return; }
  profile = data;
  renderProfile();

  // Always fetch from the backend (not just the raw Supabase row) —
  // /api/usage-status is what actually matches what the server enforces
  // for both tiers now that Pro also draws from a real 500-credit/month
  // pool (no more unconditional 'pro' bypass — see gatekeeper.js).
  try {
    const res = await authFetch('/api/usage-status', { method: 'GET' });
    const usage = await res.json();
    if (usage.status !== 'success') return;
    if (usage.isPro) {
      renderProUsage(usage.creditsUsed, usage.creditsTotal, usage.creditsRemaining);
    } else {
      renderDailyUsage(usage.dailyChatUsed, usage.dailyChatLimit);
    }
  } catch (e) { console.error('[usage-status] load failed:', e); }
}

function renderDailyUsage(used, limit) {
  const pct = Math.min(100, Math.round((used / limit) * 100));
  document.getElementById('sidebarUsagePct').textContent = pct + '%';
  document.getElementById('sidebarUsageFill').style.width = pct + '%';
  document.getElementById('sidebarCreditsNum').textContent = `${used} / ${limit} messages aujourd'hui`;
  document.getElementById('settingsSummary').textContent =
    `Plan actuel : Gratuit · ${used}/${limit} messages de chat aujourd'hui · Code, images et vidéos réservés au plan Pro`;
  document.getElementById('topupBtn').style.display = 'block';
}

function renderProUsage(used, total, remaining) {
  const pct = Math.min(100, Math.round((used / total) * 100));
  document.getElementById('sidebarUsagePct').textContent = pct + '%';
  document.getElementById('sidebarUsageFill').style.width = pct + '%';
  document.getElementById('sidebarCreditsNum').textContent = `${used} / ${total} crédits (${remaining} restants)`;
  document.getElementById('settingsSummary').textContent =
    `Plan actuel : Pro · ${used}/${total} crédits utilisés ce mois-ci (${remaining} restants)`;
  // Surface the top-up option proactively once the pool is getting low,
  // not only after they've already hit a hard block mid-message.
  document.getElementById('topupBtn').style.display = 'block';
}

function renderProfile() {
  if (!profile) return;
  const initial = (profile.full_name || profile.email || '?').charAt(0).toUpperCase();
  const displayName = profile.full_name || profile.email.split('@')[0];
  const isPro = profile.subscription_status === 'pro';

  document.getElementById('userAvatar').textContent = initial;
  document.getElementById('topbarUserName').textContent = displayName;
  document.getElementById('topbarUserPlan').textContent = isPro ? 'Pro Plan' : 'Plan Gratuit';
  document.getElementById('heroGreeting').textContent = `Bienvenue, ${displayName} ! 👋`;

  // Overwritten right after by renderProUsage()/renderDailyUsage() once
  // /api/usage-status responds — this is just the safe initial state.
  document.getElementById('sidebarUsagePct').textContent = '…';
  document.getElementById('sidebarUsageFill').style.width = '0%';
  document.getElementById('sidebarCreditsNum').textContent = '…';

  document.getElementById('upgradeBtn').style.display = isPro ? 'none' : 'block';
  document.getElementById('settingsUpgradeBtn').style.display = isPro ? 'none' : 'block';
}

// TOPUP_PRICE_PER_CREDIT must match backend/createTopupSession.js
// (TOPUP_PRICE_PER_CREDIT_USD, default $0.02/credit).
const TOPUP_PRICE_PER_CREDIT = 0.01;

let selectedTopupCredits = 1000;

function setTopupCredits(value) {
  const credits = Math.min(
    10000,
    Math.max(1000, Math.round(Number(value) / 1000) * 1000)
  );

  selectedTopupCredits = credits;

  document.getElementById('topupSlider').value = String(credits);
  document.getElementById('topupCreditsValue').textContent = credits.toLocaleString();
  document.getElementById('topupSummaryCredits').textContent =
    `${credits.toLocaleString()} crédits`;
  const topupPriceUsd =
    credits >= 5000
      ? credits * 0.008
      : credits * TOPUP_PRICE_PER_CREDIT;

  document.getElementById('topupSummaryPrice').textContent =
    `$${topupPriceUsd.toFixed(2)}`;

  document.querySelectorAll('.credit-pack').forEach(pack => {
    pack.classList.toggle(
      'active',
      Number(pack.dataset.credits) === credits
    );
  });
}

function handleTopup() {
  if (!session) {
    showLogin();
    return;
  }

  setTopupCredits(1000);
  document.getElementById('topupModal').classList.add('active');
}

function closeTopupModal() {
  document.getElementById('topupModal').classList.remove('active');

async function submitTopupPayment() {
  const payButton = document.getElementById('topupPayBtn');
  payButton.disabled = true;
  payButton.textContent = 'Opening payment...';

  try {
    const res = await authFetch('/api/create-topup-session', {
      method: 'POST',
      body: JSON.stringify({
        credits: selectedTopupCredits
      }),
    });

    const data = await res.json();

    if (data.url) {
      window.location.href = data.url;
      return;
    }

    alert(data.message || 'Payment session could not be created.');
  } catch (err) {
    console.error('[topup] failed:', err.message);
    alert('Payment session could not be created.');
  } finally {
    payButton.disabled = false;
    payButton.textContent = 'Continue to payment';
  }
}

/* ROX SETTINGS CORE FUNCTIONS START */
const ROX_SETTINGS_KEYS = {
  uiLanguage: 'roxUiLanguage',
  theme: 'roxTheme',
  startPage: 'roxStartPage',
  density: 'roxDensity',
  voiceName: 'roxVoiceName',
  voiceRate: 'roxVoiceRate',
  autoRead: 'roxAutoRead',
  stopVoiceOnRecord: 'roxStopVoiceOnRecord'
};

function getRoxBooleanSetting(key, fallback = false) {
  const value = localStorage.getItem(key);

  if (value === null) {
    return fallback;
  }

  return value === 'true';
}

function setRoxBooleanSetting(key, value) {
  localStorage.setItem(
    key,
    String(Boolean(value))
  );
}

function getRoxSystemTheme() {
  return window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: light)').matches
      ? 'light'
      : 'dark';
}

function applyRoxTheme(themeValue) {
  const selectedTheme =
    themeValue || 'system';

  const resolvedTheme =
    selectedTheme === 'system'
      ? getRoxSystemTheme()
      : selectedTheme;

  document.documentElement.dataset.roxTheme =
    resolvedTheme;

  document.documentElement.dataset.roxThemePreference =
    selectedTheme;
}

function applyRoxDensity(densityValue) {
  document.documentElement.dataset.roxDensity =
    densityValue === 'compact'
      ? 'compact'
      : 'comfortable';
}

function resolveRoxUiLanguage(languageValue) {
  if (
    languageValue &&
    languageValue !== 'auto'
  ) {
    return languageValue;
  }

  return (
    navigator.languages &&
    navigator.languages[0]
      ? navigator.languages[0]
      : navigator.language || 'fr'
  ).split('-')[0];
}

function applyRoxUiLanguage(languageValue) {
  const resolvedLanguage =
    resolveRoxUiLanguage(languageValue);

  document.documentElement.lang =
    resolvedLanguage;

  document.documentElement.dir =
    resolvedLanguage === 'ar'
      ? 'rtl'
      : 'ltr';

  document.documentElement.dataset.roxUiLanguage =
    resolvedLanguage;
}

function getRoxSpeechRate() {
  const savedRate = Number(
    localStorage.getItem(
      ROX_SETTINGS_KEYS.voiceRate
    )
  );

  if (
    Number.isFinite(savedRate) &&
    savedRate >= 0.75 &&
    savedRate <= 1.5
  ) {
    return savedRate;
  }

  return 1;
}

function getRoxSelectedVoice(voices) {
  const selectedVoiceId =
    localStorage.getItem(
      ROX_SETTINGS_KEYS.voiceName
    );

  if (!selectedVoiceId) {
    return null;
  }

  return voices.find(
    voice =>
      voice.voiceURI === selectedVoiceId ||
      voice.name === selectedVoiceId
  ) || null;
}

function speakRoxText(text) {
  if (
    !text ||
    !('speechSynthesis' in window)
  ) {
    return;
  }

  const speech =
    new SpeechSynthesisUtterance(
      String(text)
    );

  const selectedLanguage =
    localStorage.getItem(
      'roxVoiceLanguage'
    );

  const isArabic =
    /[\u0600-\u06FF]/.test(
      String(text)
    );

  const preferredLang =
    selectedLanguage ||
    (
      isArabic
        ? 'ar-MA'
        : (
            document.documentElement.lang ||
            navigator.language ||
            'fr-FR'
          )
    );

  speech.lang = preferredLang;
  speech.rate = getRoxSpeechRate();
  speech.pitch = 1;
  speech.volume = 1;

  const voices =
    window.speechSynthesis.getVoices();

  const selectedVoice =
    getRoxSelectedVoice(voices);

  const exactVoice = voices.find(
    voice =>
      voice.lang.toLowerCase() ===
      preferredLang.toLowerCase()
  );

  const languageVoice = voices.find(
    voice =>
      voice.lang.toLowerCase().startsWith(
        preferredLang
          .toLowerCase()
          .split('-')[0]
      )
  );

  speech.voice =
    selectedVoice ||
    exactVoice ||
    languageVoice ||
    null;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);
}

function maybeAutoReadRoxMessage(text) {
  if (
    !getRoxBooleanSetting(
      ROX_SETTINGS_KEYS.autoRead,
      false
    )
  ) {
    return;
  }

  speakRoxText(text);
}

function populateRoxSettingsVoiceLanguages() {
  const select =
    document.getElementById(
      'settingsVoiceLanguage'
    );

  if (
    !select ||
    typeof voiceLanguages === 'undefined'
  ) {
    return;
  }

  select.innerHTML = '';

  voiceLanguages.forEach(
    ([value, label]) => {
      const option =
        document.createElement('option');

      option.value = value;
      option.textContent = label;

      select.appendChild(option);
    }
  );

  select.value =
    localStorage.getItem(
      'roxVoiceLanguage'
    ) || '';
}

function populateRoxSettingsVoices() {
  const select =
    document.getElementById(
      'settingsVoiceName'
    );

  if (
    !select ||
    !('speechSynthesis' in window)
  ) {
    return;
  }

  const previousValue =
    localStorage.getItem(
      ROX_SETTINGS_KEYS.voiceName
    ) || '';

  const voices =
    window.speechSynthesis
      .getVoices()
      .slice()
      .sort((a, b) =>
        `${a.lang} ${a.name}`.localeCompare(
          `${b.lang} ${b.name}`
        )
      );

  select.innerHTML = '';

  const automaticOption =
    document.createElement('option');

  automaticOption.value = '';
  automaticOption.textContent =
    'Automatique';

  select.appendChild(
    automaticOption
  );

  voices.forEach(voice => {
    const option =
      document.createElement('option');

    option.value =
      voice.voiceURI || voice.name;

    option.textContent =
      `${voice.name} — ${voice.lang}`;

    select.appendChild(option);
  });

  select.value = voices.some(
    voice =>
      voice.voiceURI === previousValue ||
      voice.name === previousValue
  )
    ? previousValue
    : '';
}

// ── authenticated fetch helper ──────────────────────────────────────
const BACKEND_UNAVAILABLE_MSG = 'Backend Rox AI indisponible. Démarrez le serveur sur le port 3001.';

async function authFetch(path, options = {}) {
  if (!session) { showLogin(); throw new Error('not_authenticated'); }
  if (session.access_token === DEMO_TOKEN) return demoFetch(path, options);

  let res;
  try {
    res = await fetch(CONFIG.API_BASE + path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${session.access_token}`,
        ...(options.headers || {}),
      },
    });
  } catch (networkErr) {
    // fetch() throws (TypeError: Failed to fetch) when the backend is
    // down/unreachable — surface that clearly instead of a generic error.
    console.error('[authFetch] backend unreachable:', networkErr.message);
    showConfigBanner(BACKEND_UNAVAILABLE_MSG);
    throw new Error('backend_unavailable');
  }

  if (res.status === 401) {
    await supa.auth.signOut();
    showLogin();
    throw new Error('session_expired');
  }
  return res;
}

// ── conversation history (per feature: 'chat' / 'code') ─────────────
// Previously each call to /api/chat sent only the current message
// (`messages: [{role:'user', content:text}]`), so the model had no
// memory of anything said earlier in the same session even though the
// backend (lib/inputValidation.js) already supports a full history up
// to MAX_MESSAGES_PER_CHAT (40). Kept in memory only (cleared on page
// reload) — no browser storage involved.
const CHAT_HISTORY_LIMIT = 40; // mirrors backend MAX_MESSAGES_PER_CHAT default
const conversations = { chat: [], code: [] };

function pushHistory(feature, role, content) {
  const hist = conversations[feature];
  if (!hist) return;
  hist.push({ role, content });
  if (hist.length > CHAT_HISTORY_LIMIT) hist.splice(0, hist.length - CHAT_HISTORY_LIMIT);
}

// ── message rendering helpers ───────────────────────────────────────
function appendMsg(msgBox, cls, content, isNode, meta = {}) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;

  if (isNode) {
    el.appendChild(content);
  } else {
    el.textContent = content;
  }

  msgBox.appendChild(el);

  const isBotMessage = String(cls)
    .split(/\s+/)
    .includes('bot');

  if (isBotMessage) {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    const showFeedback = (message) => {
      let note = actions.nextElementSibling;

      if (!note || !note.classList.contains('msg-feedback')) {
        note = document.createElement('div');
        note.className = 'msg-feedback';
        actions.insertAdjacentElement('afterend', note);
      }

      note.textContent = message;
      note.classList.add('show');

      clearTimeout(note._hideTimer);
      note._hideTimer = setTimeout(() => {
        note.classList.remove('show');
      }, 1600);
    };

    // ROX SAVE FEEDBACK START
    const saveFeedback = async (rating) => {
      if (!meta.responseId) {
        showFeedback(
          'Évaluation disponible pour les nouvelles réponses du chat.'
        );
        return false;
      }

      try {
        const response = await authFetch('/api/chat-feedback', {
          method: 'POST',
          body: JSON.stringify({
            responseId: meta.responseId,
            rating,
            model: meta.model || null,
            feature: meta.feature || 'chat'
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.message || 'feedback_save_failed'
          );
        }

        return true;
      } catch (error) {
        console.error(
          'ROX AI feedback save failed:',
          error
        );

        showFeedback(
          "Impossible d'enregistrer votre avis."
        );

        return false;
      }
    };
    // ROX SAVE FEEDBACK END
    const getMessageText = () =>
      (el.innerText || el.textContent || '').trim();

    const makeAction = (symbol, title, handler) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'msg-action';
      button.textContent = symbol;
      button.title = title;
      button.setAttribute('aria-label', title);

      button.addEventListener('click', async () => {
        try {
          await handler(button);
        } catch (error) {
          console.error('ROX AI message action failed:', error);
        }
      });

      actions.appendChild(button);
      return button;
    };

    const copyText = async (text) => {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    };

    makeAction('\u2398', 'Copier', async (button) => {
      const text = getMessageText();
      if (!text) return;

      await copyText(text);

      const oldSymbol = button.textContent;
      button.textContent = '\u2713';

      setTimeout(() => {
        button.textContent = oldSymbol;
      }, 1200);
    });

    makeAction('\uD83D\uDD0A', 'Écouter', (button) => {
      if (!('speechSynthesis' in window)) return;

      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        button.classList.remove('is-active');
        return;
      }

      const text = getMessageText();
      if (!text) return;

      const speech = new SpeechSynthesisUtterance(text);
      const isArabic = /[\u0600-\u06FF]/.test(text);

      const preferredLang = isArabic
        ? 'ar-MA'
        : (document.documentElement.lang ||
           navigator.language ||
           'fr-FR');

      speech.lang = preferredLang;
      speech.rate = getRoxSpeechRate();
      speech.pitch = 1;
      speech.volume = 1;

      const voices = window.speechSynthesis.getVoices();

      const exactVoice = voices.find(
        voice =>
          voice.lang.toLowerCase() === preferredLang.toLowerCase()
      );

      const arabicVoice = isArabic
        ? voices.find(voice => /^ar(-|$)/i.test(voice.lang))
        : null;

      const languageVoice = voices.find(
        voice =>
          voice.lang.toLowerCase().startsWith(
            preferredLang.toLowerCase().split('-')[0]
          )
      );

      const savedVoice =
        getRoxSelectedVoice(voices);

      const selectedVoice =
        savedVoice ||
        exactVoice ||
        arabicVoice ||
        languageVoice;

      if (selectedVoice) {
        speech.voice = selectedVoice;
      }

      button.classList.add('is-active');

      const stopActiveState = () => {
        button.classList.remove('is-active');
      };

      speech.onend = stopActiveState;
      speech.onerror = stopActiveState;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(speech);
    });

    let likeButton;
    let dislikeButton;

function createCodeArtifact(rawText) {
  const fenced = String(rawText || '').match(/```([a-zA-Z0-9+#.-]*)\s*([\s\S]*?)```/);
  const language = (fenced?.[1] || '').toLowerCase();

  let code = (fenced ? fenced[2] : String(rawText || '')).trim();
  const htmlStart = code.search(/<!doctype html|<html[\s>]/i);
  if (htmlStart > 0) code = code.slice(htmlStart);

  if (!code) return null;

  const isHtml = /<!doctype html|<html[\s>]|<body[\s>]/i.test(code);
  const extensions = {
    javascript: 'js',
    js: 'js',
    typescript: 'ts',
    ts: 'ts',
    python: 'py',
    css: 'css',
    html: 'html'
  };

  const extension = isHtml ? 'html' : (extensions[language] || 'txt');
  const fileName = isHtml ? 'index.html' : `main.${extension}`;

  const escapeHtml = value => String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;');

  const previewDocument = isHtml
    ? code
    : `<!doctype html><html><body style="margin:0;background:#111114;color:#e5e7eb;"><pre style="padding:24px;white-space:pre-wrap;font:14px/1.6 monospace;">${escapeHtml(code)}</pre></body></html>`;

  const card = document.createElement('div');
  card.className = 'artifact-card';

  card.innerHTML = `
    <div class="artifact-head">
      <div class="artifact-title">
        <div class="artifact-icon">⌨️</div>
        <div>
          <div class="artifact-name">${fileName}</div>
          <div class="artifact-type">${isHtml ? 'Application web interactive' : 'Code généré'}</div>
        </div>
      </div>
      <button class="artifact-open" type="button">Ouvrir ↗</button>
    </div>

    <iframe class="artifact-preview" title="Aperçu du code"></iframe>

    <div class="artifact-actions">
      <button type="button" data-artifact-preview>Aperçu</button>
      <button type="button" data-artifact-code>Code</button>
      <button type="button" data-artifact-copy>Copier</button>
      <button type="button" data-artifact-download>Télécharger</button>
    </div>
  `;

  const modal = document.createElement('div');
  modal.className = 'artifact-modal';

  modal.innerHTML = `
    <div class="artifact-shell">
      <div class="artifact-toolbar">
        <div class="artifact-tabs">
          <button type="button" data-tab="preview" class="active">Aperçu</button>
          <button type="button" data-tab="code">Code</button>
        </div>
        <button type="button" class="artifact-close">✕</button>
      </div>

      <div class="artifact-body">
        <iframe title="Aperçu complet"></iframe>
        <pre class="artifact-code"></pre>
      </div>
    </div>
  `;

  document.body.appendChild(modal);

  const cardFrame = card.querySelector('.artifact-preview');
  const modalFrame = modal.querySelector('iframe');
  const modalCode = modal.querySelector('.artifact-code');

  cardFrame.srcdoc = previewDocument;
  modalFrame.srcdoc = previewDocument;
  modalCode.textContent = code;

  function showTab(tab) {
    const previewActive = tab === 'preview';

    modalFrame.style.display = previewActive ? 'block' : 'none';
    modalCode.style.display = previewActive ? 'none' : 'block';

    modal.querySelectorAll('[data-tab]').forEach(button => {
      button.classList.toggle('active', button.dataset.tab === tab);
    });
  }

  function openArtifact(tab = 'preview') {
    showTab(tab);
    modal.classList.add('active');
  }

  card.querySelector('.artifact-open').onclick = () => openArtifact('preview');
  card.querySelector('[data-artifact-preview]').onclick = () => openArtifact('preview');
  card.querySelector('[data-artifact-code]').onclick = () => openArtifact('code');

  card.querySelector('[data-artifact-copy]').onclick = async event => {
    const copyButton = event.currentTarget;
    await navigator.clipboard.writeText(code);

    copyButton.textContent = 'Copi\u00E9 \u2713';

    setTimeout(() => {
      copyButton.textContent = 'Copier';
    }, 1500);
  };

  card.querySelector('[data-artifact-download]').onclick = () => {
    const blob = new Blob([code], {
      type: isHtml ? 'text/html;charset=utf-8' : 'text/plain;charset=utf-8'
    });

    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    link.click();

    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  };

  modal.querySelectorAll('[data-tab]').forEach(button => {
    button.onclick = () => showTab(button.dataset.tab);
  });

  modal.querySelector('.artifact-close').onclick = () => {
    modal.classList.remove('active');
  };

  modal.onclick = event => {
    if (event.target === modal) modal.classList.remove('active');
  };

  return card;
}
async function sendChat(feature, text, msgBox) {
  if (feature === 'code') appendMsg(msgBox, 'status', 'Coût estimé : 2 à 10 Credits');
  const typing = appendTyping(msgBox);
  // Send the stored history PLUS this new turn, but don't commit the new
  // turn to `conversations[feature]` until the call actually succeeds.
  // The Anthropic Messages API requires strict user/assistant
  // alternation — if we saved the user turn up front and the call then
  // failed (402/429/network error), a retry would stack two 'user'
  // turns in a row with nothing in between, which the API rejects.
  const outgoing = [...conversations[feature], { role: 'user', content: text }];
  try {
    const res = await authFetch('/api/chat', {
      method: 'POST',
      body: JSON.stringify({
        messages: outgoing,
        feature,
        aiPreferences:
          getRoxAiPreferences()
      }),
    });
    const data = await res.json();
    typing.remove();

    if (res.status === 402) {
      let msg = '⚠️ Crédit insuffisant — passe au plan Pro pour continuer.';
      if (data.code === 'code_requires_pro') msg = '💻 مساعدة الكود متاحة فقط للمشتركين Pro — رقّي حسابك للمتابعة.';
      if (data.code === 'pro_out_of_credits') msg = `💳 ${data.message}`;
      appendMsg(msgBox, 'status', msg);
      return;
    }
    if (res.status === 429 && data.code === 'daily_chat_limit') {
      appendMsg(msgBox, 'status', `🌙 ${data.message}`);
      return;
    }
    if (res.status === 429) { appendMsg(msgBox, 'status', `⏳ Trop de requêtes — réessaie dans ${data.retry_after_seconds || 'quelques'}s.`); return; }
    if (res.status === 400) {
      // Conversation grew past what the backend accepts in one request
      // (message count/char limits) — drop the oldest turns and let the
      // user retry, instead of silently failing forever.
      conversations[feature] = conversations[feature].slice(-10);
      appendMsg(msgBox, 'error', 'Conversation trop longue — historique réduit, réessaie.');
      return;
    }
    if (!res.ok) { appendMsg(msgBox, 'error', data.message || 'Erreur — tous les modèles ont échoué.'); return; }

    if (feature === 'code') {
  const artifact = createCodeArtifact(data.text);

  if (artifact) {
    msgBox.appendChild(artifact);
    msgBox.scrollTop = msgBox.scrollHeight;
  } else {
    appendMsg(msgBox, 'bot', data.text, false, { responseId: data.responseId, model: data.model, feature });
  }
} else {
  appendMsg(msgBox, 'bot', data.text, false, { responseId: data.responseId, model: data.model, feature });
}
  if (feature === 'chat') {
    maybeAutoReadRoxMessage(data.text);
  }
  if (feature === 'code' && typeof data.creditsCharged === 'number') {
    appendMsg(msgBox, 'status', `Coût final : ${data.creditsCharged} crédits`);
  }
    pushHistory(feature, 'user', text);
    pushHistory(feature, 'assistant', data.text);
    if (typeof data.dailyChatUsed === 'number') {
      renderDailyUsage(data.dailyChatUsed, data.dailyChatLimit);
    }
    if (typeof data.newBalance === 'number' && profile) {
      const total = profile.credits_total || 500;
      const used = total - data.newBalance;
      renderProUsage(used, total, data.newBalance);
    }
  } catch (err) {
    typing.remove();
    if (err.message === 'backend_unavailable') appendMsg(msgBox, 'error', BACKEND_UNAVAILABLE_MSG);
    else if (err.message !== 'session_expired') appendMsg(msgBox, 'error', 'Erreur réseau — réessaie.');
  }
}

// ── images / videos → POST /api/generate-* then poll job status ────
const GEN_ROUTES = { images: '/api/generate-image', videos: '/api/generate-video' };
const GEN_POLL_MS = 2500;
const GEN_TIMEOUT_MS = 120000;

async function sendGeneration(feature, text, msgBox) {
  const typing = appendTyping(msgBox);
  try {
    const res = await authFetch(GEN_ROUTES[feature], { method: 'POST', body: JSON.stringify({ prompt: text, aiPreferences: getRoxAiPreferences() }) });
    const data = await res.json();

    if (res.status === 403 && data.code === 'pro_out_of_credits') {
      typing.remove();
      appendMsg(msgBox, 'status', `💳 ${data.message}`);
      return;
    }
    if (res.status === 402) {
      typing.remove();
      let msg = '⚠️ Crédit insuffisant — passe au plan Pro pour continuer.';
      if (data.code === 'video_requires_pro') msg = '🎬 توليد الفيديو متاح فقط للمشتركين Pro — رقّي حسابك للمتابعة.';
      if (data.code === 'image_requires_pro') msg = '🖼️ توليد الصور متاح فقط للمشتركين Pro — رقّي حسابك للمتابعة.';
      appendMsg(msgBox, 'status', msg);
      return;
    }
    if (res.status === 429) { typing.remove(); appendMsg(msgBox, 'status', `⏳ Trop de requêtes — réessaie dans ${data.retry_after_seconds || 'quelques'}s.`); return; }
    if (!res.ok || !data.jobId) { typing.remove(); appendMsg(msgBox, 'error', data.message || 'Échec de la création du job.'); return; }

    if (typeof data.newBalance === 'number' && profile) {
      const total = profile.credits_total || 500;
      renderProUsage(total - data.newBalance, total, data.newBalance);
    }

    await pollJob(data.jobId, feature, msgBox, typing);
  } catch (err) {
    typing.remove();
    if (err.message === 'backend_unavailable') appendMsg(msgBox, 'error', BACKEND_UNAVAILABLE_MSG);
    else if (err.message !== 'session_expired') appendMsg(msgBox, 'error', 'Erreur réseau — réessaie.');
  }
}

async function pollJob(jobId, feature, msgBox, typing) {
  const start = Date.now();
  while (Date.now() - start < GEN_TIMEOUT_MS) {
    await new Promise(r => setTimeout(r, GEN_POLL_MS));
    let res, data;
    try {
      res = await authFetch('/api/job-status/' + jobId);
      data = await res.json();
    } catch (err) {
      if (err.message === 'session_expired') return;
      continue; // transient network error — keep polling
    }
    if (!res.ok) continue;

    if (data.status === 'done') {
      typing.remove();
      const wrap = document.createElement('div');
      if (feature === 'images') {
        const img = document.createElement('img');
        img.src = data.result_url;
        img.alt = 'Résultat généré';
        wrap.appendChild(img);
      } else {
        const vid = document.createElement('video');
        vid.src = data.result_url;
        vid.controls = true;
        wrap.appendChild(vid);
      }
      appendMsg(msgBox, 'bot', wrap, true);
      return;
    }
    if (data.status === 'failed') {
      typing.remove();
      appendMsg(msgBox, 'error', 'Échec de la génération : ' + (data.error_message || 'erreur inconnue') + ' (crédits remboursés).');
      return;
    }
  }
  typing.remove();
  appendMsg(msgBox, 'status', "⏳ Ça prend plus longtemps que prévu — vérifie l'onglet Projets plus tard.");
}

function sendMessage(feature){
  const input = document.querySelector('input[data-feature="'+feature+'"]');
  const text = input.value.trim();
  if(!text) return;
  const msgBox = document.getElementById('msgs-'+feature);

  appendMsg(msgBox, 'user', text);
  input.value = '';

  if (feature === 'chat' || feature === 'code') sendChat(feature, text, msgBox);
  else if (feature === 'images' || feature === 'videos') sendGeneration(feature, text, msgBox);
  else if (feature === 'roxip') sendRoxIpDemo(text, msgBox);
}

  sendMessage(feature);
  if (cardInput) cardInput.value = '';
}

  ];

  const normalizeVoiceSearch = (value) =>
    String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim();

  const getVoiceLanguageLabel = (value) => {
    const language = voiceLanguages.find(
      ([code]) => code === value
    );

    return language
      ? language[1]
      : voiceLanguages[0][1];
  };

  const getVoiceLanguageRegion = (value) => {
    const parts = String(value || '').split('-');
    const region = parts[parts.length - 1];

    return /^[A-Za-z]{2}$/.test(region)
      ? region.toLowerCase()
      : '';
  };

  const renderVoiceLanguageFlag = (
    container,
    value
  ) => {
    container.replaceChildren();

    if (!value) {
      container.textContent = '🌐';
      container.classList.add('is-auto');
      return;
    }

    container.classList.remove('is-auto');

    const region =
      getVoiceLanguageRegion(value);

    if (!region) {
      container.textContent =
        String(value)
          .split('-')[0]
          .slice(0, 2)
          .toUpperCase();

      return;
    }

    const image =
      document.createElement('img');

    image.src =
      `https://flagcdn.com/w40/${region}.png`;

    image.alt = '';
    image.loading = 'lazy';
    image.decoding = 'async';
    image.referrerPolicy = 'no-referrer';

    image.addEventListener(
      'error',
      () => {
        container.replaceChildren();
        container.textContent =
          region.toUpperCase();
      },
      { once: true }
    );

    container.appendChild(image);
  };

  const closeRoxVoiceLanguageMenus = (
    exceptRoot = null
  ) => {
    document
      .querySelectorAll('[data-rox-voice-language]')
      .forEach((root) => {
        if (root === exceptRoot) {
          return;
        }

        const trigger = root.querySelector(
          '[data-rox-voice-language-trigger]'
        );

        const menu = root.querySelector(
          '[data-rox-voice-language-menu]'
        );

        const search = root.querySelector(
          '[data-rox-voice-language-search]'
        );

        root.classList.remove('is-open');

        if (trigger) {
          trigger.setAttribute(
            'aria-expanded',
            'false'
          );
        }

        if (menu) {
          menu.hidden = true;
        }

        if (search && search.value) {
          search.value = '';
          search.dispatchEvent(
            new Event('input')
          );
        }
      });
  };

  const setVoiceLanguage = (
    selectedLanguage
  ) => {
    if (selectedLanguage) {
      localStorage.setItem(
        'roxVoiceLanguage',
        selectedLanguage
      );
    } else {
      localStorage.removeItem(
        'roxVoiceLanguage'
      );
    }

    document
      .querySelectorAll('[data-voice-language]')
      .forEach((select) => {
        select.value = selectedLanguage;
      });

    document
      .querySelectorAll('[data-rox-voice-language]')
      .forEach((root) => {
        const label = root.querySelector(
          '[data-rox-voice-language-label]'
        );

        const trigger = root.querySelector(
          '[data-rox-voice-language-trigger]'
        );

        const selectedLabel =
          getVoiceLanguageLabel(
            selectedLanguage
          );
        const selectedIcon =
          root.querySelector(
            '.rox-voice-language-icon'
          );

        if (selectedIcon) {
          renderVoiceLanguageFlag(
            selectedIcon,
            selectedLanguage
          );
        }

        if (label) {
          label.textContent = selectedLabel;
        }

        if (trigger) {
          trigger.title =
            `Voice language: ${selectedLabel}`;
        }

        root
          .querySelectorAll(
            '.rox-voice-language-option'
          )
          .forEach((option) => {
            const isSelected =
              option.dataset.value ===
              selectedLanguage;

            option.classList.toggle(
              'is-selected',
              isSelected
            );

            option.setAttribute(
              'aria-selected',
              String(isSelected)
            );
          });
      });
  };

  document
    .querySelectorAll('[data-voice-language]')
    .forEach((select) => {
      select.innerHTML = '';

      voiceLanguages.forEach(
        ([value, label]) => {
          const option =
            document.createElement('option');

          option.value = value;
          option.textContent = label;

          select.appendChild(option);
        }
      );
    });

  document
    .querySelectorAll('[data-rox-voice-language]')
    .forEach((root) => {
      const trigger = root.querySelector(
        '[data-rox-voice-language-trigger]'
      );

      const menu = root.querySelector(
        '[data-rox-voice-language-menu]'
      );

      const search = root.querySelector(
        '[data-rox-voice-language-search]'
      );

      const optionsBox = root.querySelector(
        '[data-rox-voice-language-options]'
      );

      if (
        !trigger ||
        !menu ||
        !search ||
        !optionsBox
      ) {
        return;
      }

      optionsBox.innerHTML = '';

      const createLanguageOption = (
        value,
        label
      ) => {
        const button =
          document.createElement('button');

        button.type = 'button';
        button.className =
          'rox-voice-language-option';

        button.dataset.value = value;
        button.dataset.search =
          normalizeVoiceSearch(
            `${label} ${value}`
          );

        button.setAttribute(
          'role',
          'option'
        );

        button.setAttribute(
          'aria-selected',
          'false'
        );

        const icon =
          document.createElement('span');

        icon.className =
          'rox-voice-language-option-icon';

        renderVoiceLanguageFlag(
          icon,
          value
        );

        const text =
          document.createElement('span');

        text.className =
          'rox-voice-language-option-text';

        text.textContent = label;

        const check =
          document.createElement('span');

        check.className =
          'rox-voice-language-check';

        check.textContent = '✓';

        button.append(
          icon,
          text,
          check
        );

        button.addEventListener(
          'click',
          () => {
            setVoiceLanguage(value);
            closeRoxVoiceLanguageMenus();
          }
        );

        return button;
      };

      const appendSection = (
        title,
        languages
      ) => {
        if (!languages.length) {
          return;
        }

        const section =
          document.createElement('div');

        section.className =
          'rox-voice-language-section';

        section.textContent = title;

        optionsBox.appendChild(section);

        languages.forEach(
          ([value, label]) => {
            optionsBox.appendChild(
              createLanguageOption(
                value,
                label
              )
            );
          }
        );
      };

      const quickLanguages =
        roxVoiceQuickLanguages
          .map((code) =>
            voiceLanguages.find(
              ([value]) => value === code
            )
          )
          .filter(Boolean);

      const allLanguages =
        voiceLanguages.filter(
          ([value]) =>
            !roxVoiceQuickLanguages.includes(
              value
            )
        );

      appendSection(
        'Quick access',
        quickLanguages
      );

      appendSection(
        'All languages',
        allLanguages
      );

      const emptyMessage =
        document.createElement('div');

      emptyMessage.className =
        'rox-voice-language-empty';

      emptyMessage.textContent =
        'No language found';

      emptyMessage.hidden = true;

      optionsBox.appendChild(emptyMessage);

      search.addEventListener(
        'input',
        () => {
          const query =
            normalizeVoiceSearch(
              search.value
            );

          let visibleOptions = 0;

          optionsBox
            .querySelectorAll(
              '.rox-voice-language-option'
            )
            .forEach((option) => {
              const matches =
                !query ||
                option.dataset.search.includes(
                  query
                );

              option.hidden = !matches;

              if (matches) {
                visibleOptions += 1;
              }
            });

          optionsBox
            .querySelectorAll(
              '.rox-voice-language-section'
            )
            .forEach((section) => {
              section.hidden = Boolean(query);
            });

          emptyMessage.hidden =
            visibleOptions !== 0;
        }
      );

      trigger.addEventListener(
        'click',
        (event) => {
          event.stopPropagation();

          const shouldOpen = menu.hidden;

          closeRoxVoiceLanguageMenus(root);

          root.classList.toggle(
            'is-open',
            shouldOpen
          );

          menu.hidden = !shouldOpen;

          trigger.setAttribute(
            'aria-expanded',
            String(shouldOpen)
          );

          if (shouldOpen) {
            requestAnimationFrame(() => {
              search.focus();
            });
          }
        }
      );

      menu.addEventListener(
        'click',
        (event) => {
          event.stopPropagation();
        }
      );
    });

  const savedVoiceLanguage =
    localStorage.getItem(
      'roxVoiceLanguage'
    ) || '';

  const validVoiceLanguage =
    voiceLanguages.some(
      ([value]) =>
        value === savedVoiceLanguage
    )
      ? savedVoiceLanguage
      : '';

  setVoiceLanguage(
    validVoiceLanguage
  );

  document.addEventListener(
    'click',
    () => {
      closeRoxVoiceLanguageMenus();
    }
  );

  document.addEventListener(
    'keydown',
    (event) => {
      if (event.key === 'Escape') {
        closeRoxVoiceLanguageMenus();
      }
    }
  );
  document
    .querySelectorAll('[data-voice-input]')
    .forEach((button) => {
      const feature = button.dataset.voiceInput;

      const input = document.querySelector(
        `input[data-feature="${feature}"]`
      );

      if (!input) return;

      if (!VoiceRecognition) {
        button.addEventListener('click', () => {
          input.placeholder =
            "La dictée vocale n'est pas disponible dans ce navigateur.";
          input.focus();
        });

        return;
      }

      const recognition = new VoiceRecognition();

      recognition.lang =

        localStorage.getItem("roxVoiceLanguage") ||

        (navigator.languages && navigator.languages[0]) ||

        navigator.language ||

        "ar-MA";
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      const normalPlaceholder =
        input.getAttribute('placeholder') ||
        'Posez votre question...';

      let textBeforeRecording = '';

      button.addEventListener('click', () => {
        if (button.classList.contains('is-listening')) {
          recognition.stop();
          return;
        }

        textBeforeRecording = input.value.trim();

        if (
          getRoxBooleanSetting(
            ROX_SETTINGS_KEYS.stopVoiceOnRecord,
            true
          ) &&
          'speechSynthesis' in window
        ) {
          window.speechSynthesis.cancel();
        }

        recognition.lang = getVoiceLanguage();

        try {
          recognition.start();
        } catch (error) {
          console.warn(
            'Voice recognition is already active:',
            error
          );
        }
      });

      recognition.addEventListener('start', () => {
        button.classList.add('is-listening');
        button.setAttribute('aria-pressed', 'true');
        button.title = 'Arrêter la dictée';
        input.placeholder = 'كنسمع ليك...';
      });

      recognition.addEventListener('result', (event) => {
        let spokenText = '';

        for (
          let index = event.resultIndex;
          index < event.results.length;
          index++
        ) {
          spokenText +=
            event.results[index][0].transcript + ' ';
        }

        spokenText = spokenText.trim();

        input.value = [
          textBeforeRecording,
          spokenText
        ]
          .filter(Boolean)
          .join(' ');

        input.dispatchEvent(
          new Event('input', {
            bubbles: true
          })
        );
      });

      recognition.addEventListener('end', () => {
        button.classList.remove('is-listening');
        button.setAttribute('aria-pressed', 'false');
        button.title = 'Dicter un message';
        input.placeholder = normalPlaceholder;
        input.focus();
      });

      recognition.addEventListener('error', (event) => {
        console.warn(
          'Voice recognition error:',
          event.error
        );

        button.classList.remove('is-listening');
        button.setAttribute('aria-pressed', 'false');
        button.title = 'Dicter un message';

        input.placeholder =
          event.error === 'not-allowed'
            ? "Autorisez l'accès au microphone."
            : normalPlaceholder;
      });
    });
}
// ROX VOICE INPUT LOGIC END
initAuth();
<\/script>

<script>
// ══════════════════════════════════════════════════════════════════
// ROX AI — single-URL device router
// Runs immediately (synchronously, before the browser paints anything)
// to decide which complete interface to load, then replaces this
// shell document with the full chosen document via document.write().
// Because this happens before first paint and before any visible
// content exists in this shell, there is no flash of the wrong layout.
//
// Breakpoint: screen width <= 768px -> mobile interface
//             screen width  > 768px -> desktop interface
// ══════════════════════════════════════════════════════════════════
(function () {
  'use strict';

  function unescapeScriptTags(raw) {
    // Reverses the escaping applied below (a backslash inserted right
    // after every '<' of a script-closing tag) so the document handed
    // to document.write() is byte-for-byte the original mobile/desktop
    // HTML.
    return raw.replace(/<\\\/script/gi, '<' + '/script');
  }

  var isMobile = window.innerWidth <= 768;
  var sourceId = isMobile ? 'rox-src-mobile' : 'rox-src-desktop';
  var sourceEl = document.getElementById(sourceId);
  var fullHtml = unescapeScriptTags(sourceEl.textContent);

  // ── resize / rotation support ───────────────────────────────────
  // Appended into the chosen document right before its closing
  // </body> tag. If the viewport crosses the 768px breakpoint after
  // load (window resize or device rotation), reload this same URL
  // once so index.html re-detects and serves the correct interface.
  // The reload only fires when the category actually flips (mobile
  // <-> desktop), and a fresh load re-evaluates the flag from the
  // real current width, so this cannot loop indefinitely — it can
  // only fire again after another real crossing of the breakpoint.
  var deviceWatcher =
    '<' + 'script>' +
    '(function(){' +
    'var __roxInitialIsMobile=' + (isMobile ? 'true' : 'false') + ';' +
    'var __roxResizeTimer=null;' +
    'function __roxCheckDevice(){' +
    'var nowMobile=window.innerWidth<=768;' +
    'if(nowMobile!==__roxInitialIsMobile){location.reload();}' +
    '}' +
    'window.addEventListener("resize",function(){' +
    'clearTimeout(__roxResizeTimer);' +
    '__roxResizeTimer=setTimeout(__roxCheckDevice,250);' +
    '});' +
    'window.addEventListener("orientationchange",function(){' +
    'setTimeout(__roxCheckDevice,350);' +
    '});' +
    '})();' +
    '<' + '/script>';

  if (/<\/body>/i.test(fullHtml)) {
    fullHtml = fullHtml.replace(/<\/body>(?![\s\S]*<\/body>)/i, deviceWatcher + '<' + '/body>');
  } else {
    fullHtml += deviceWatcher;
  }

  document.open();
  document.write(fullHtml);
  document.close();
})();
</script>
