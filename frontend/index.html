}

async function saveRoxAccountProfile(){
  if(!profile || !session) return;

  const input=document.getElementById('roxAccountNameInput');
  const status=document.getElementById('roxAccountEditorStatus');
  const save=document.getElementById('roxAccountSave');

  const fullName=String(input?.value || '').trim();

  if(!fullName){
    if(status) status.textContent='Enter a display name.';
    return;
  }

  if(save) save.disabled=true;
  if(status) status.textContent='Saving…';

  try{
    const {data,error}=await supa
      .from('profiles')
      .update({full_name:fullName})
      .eq('id',session.user.id)
      .select()
      .single();

    if(error) throw error;

    profile={
      ...profile,
      ...data,
      full_name:fullName
    };

    renderProfile();
    refreshRoxAccountCenter();

    if(typeof syncRoxSettingsAccount==='function'){
      syncRoxSettingsAccount();
    }

    if(status) status.textContent='✓ Profile updated';
  }catch(error){
    console.error('[account] profile update failed:',error);
    if(status){
      status.textContent=
        error?.message || 'Could not update profile.';
    }
  }finally{
    if(save) save.disabled=false;
  }
}

async function handleRoxAccountPhoto(event){
  if(!profile || !session) return;

  const file=event.target.files?.[0];

  if(!file) return;

  const status=document.getElementById('roxAccountEditorStatus');

  if(file.size>5*1024*1024){
    if(status) status.textContent='Image must be 5 MB or smaller.';
    event.target.value='';
    return;
  }

  if(!/^image\/(jpeg|png|webp)$/i.test(file.type)){
    if(status) status.textContent='Use JPG, PNG or WebP.';
    event.target.value='';
    return;
  }

  if(status) status.textContent='Uploading photo…';

  try{
    const ext=
      file.type==='image/png'
        ? 'png'
        : file.type==='image/webp'
          ? 'webp'
          : 'jpg';

    const path=
      `${session.user.id}/avatar-${Date.now()}.${ext}`;

    const {error:uploadError}=await supa
      .storage
      .from('avatars')
      .upload(path,file,{
        cacheControl:'3600',
        upsert:false,
        contentType:file.type
      });

    if(uploadError) throw uploadError;

    const {
      data:publicData
    }=supa
      .storage
      .from('avatars')
      .getPublicUrl(path);

    const avatarUrl=
      publicData?.publicUrl || '';

    if(!avatarUrl){
      throw new Error('Avatar URL was not returned.');
    }

    const {data,error:updateError}=await supa
      .from('profiles')
      .update({avatar_url:avatarUrl})
      .eq('id',session.user.id)
      .select()
      .single();

    if(updateError) throw updateError;

    profile={
      ...profile,
      ...data,
      avatar_url:avatarUrl
    };

    renderProfile();
    refreshRoxAccountCenter();

    if(status) status.textContent='✓ Profile photo updated';
  }catch(error){
    console.error('[account] avatar upload failed:',error);

    if(status){
      status.textContent=
        error?.message ||
        'Could not upload profile photo.';
    }
  }finally{
    event.target.value='';
  }
}

document.addEventListener('click',event=>{

// TOPUP_PRICE_PER_CREDIT must match backend/createTopupSession.js
// (TOPUP_PRICE_PER_CREDIT_USD, default $0.02/credit).
const TOPUP_PRICE_PER_CREDIT = 0.01;

let selectedTopupCredits = 1000;

function setTopupCredits(value) {
  const credits = Math.min(
    10000,
    Math.max(1000, Math.round(Number(value) / 1000) * 1000)
  );

  selectedTopupCredits = credits;

  document.getElementById('topupSlider').value = String(credits);
  document.getElementById('topupCreditsValue').textContent = credits.toLocaleString();
  document.getElementById('topupSummaryCredits').textContent =
    roxT('topup.creditsAmount', { count: credits.toLocaleString() });
  const topupPriceUsd =
    credits >= 5000
      ? credits * 0.008
      : credits * TOPUP_PRICE_PER_CREDIT;

  document.getElementById('topupSummaryPrice').textContent =
    `$${topupPriceUsd.toFixed(2)}`;

  document.querySelectorAll('.credit-pack').forEach(pack => {
    pack.classList.toggle(
      'active',
      Number(pack.dataset.credits) === credits
    );
  });
}

function handleTopup() {
  if (!session) {
    showLogin();
    return;
  }

  setTopupCredits(1000);
  document.getElementById('topupModal').classList.add('active');
}

function closeTopupModal() {
  document.getElementById('topupModal').classList.remove('active');
}

async function submitTopupPayment() {
  const payButton = document.getElementById('topupPayBtn');
  payButton.disabled = true;
  payButton.textContent = roxT('topup.opening');

  try {
    const res = await authFetch('/api/create-topup-session', {
      method: 'POST',
      body: JSON.stringify({
        credits: selectedTopupCredits
      }),
    });

    const data = await res.json();

    if (data.url) {
      window.location.href = data.url;
      return;
    }

    alert(data.message || roxT('topup.paymentError'));
  } catch (err) {
    console.error('[topup] failed:', err.message);
    alert(roxT('topup.paymentError'));
  } finally {
    payButton.disabled = false;
    payButton.textContent = roxT('topup.continue');
  }
}

function getRoxUiLanguage() {
  const selectedLanguage =
    localStorage.getItem(
      ROX_SETTINGS_KEYS.uiLanguage
    ) || 'auto';

  const resolvedLanguage =
    resolveRoxUiLanguage(selectedLanguage);

  return ROX_UI_LANGUAGES.includes(
    resolvedLanguage
  )
    ? resolvedLanguage
    : 'en';
}

function roxT(key, variables = {}) {
  const language = getRoxUiLanguage();

  const translatedText =
    ROX_I18N[language]?.[key] ??
    ROX_I18N.en?.[key] ??
    key;

  return Object.entries(variables).reduce(
    (result, [variableName, value]) =>
      result.replaceAll(
        `{{${variableName}}}`,
        String(value)
      ),
    translatedText
  );
}

function roxTForLanguage(language, key, variables = {}) {
  const selectedLanguage =
    ROX_UI_LANGUAGES.includes(language)
      ? language
      : 'en';

  const translatedText =
    ROX_I18N[selectedLanguage]?.[key] ??
    ROX_I18N.en?.[key] ??
    key;

  return Object.entries(variables).reduce(
    (result, [variableName, value]) =>
      result.replaceAll(
        `{{${variableName}}}`,
        String(value)
      ),
    translatedText
  );
}

function translateRoxUi(root = document) {
  root
    .querySelectorAll('[data-i18n]')
    .forEach(element => {
      const key = element.dataset.i18n;

      if (key) {
        element.textContent = roxT(key);
      }
    });

  root
    .querySelectorAll('[data-i18n-placeholder]')
    .forEach(element => {
      const key =
        element.dataset.i18nPlaceholder;

      if (key) {
        element.setAttribute(
          'placeholder',
          roxT(key)
        );
      }
    });

  root
    .querySelectorAll('[data-i18n-title]')
    .forEach(element => {
      const key =
        element.dataset.i18nTitle;

      if (key) {
        element.setAttribute(
          'title',
          roxT(key)
        );
      }
    });

  root
    .querySelectorAll('[data-i18n-aria-label]')
    .forEach(element => {
      const key =
        element.dataset.i18nAriaLabel;

      if (key) {
        element.setAttribute(
          'aria-label',
          roxT(key)
        );
      }
    });

  root
    .querySelectorAll('[data-i18n-html]')
    .forEach(element => {
      const key = element.dataset.i18nHtml;

      if (key) {
        element.innerHTML = roxT(key);
      }
    });
}

function syncRoxDynamicUi() {
  const loginSubmit =
    document.getElementById('login-submit');
  const loginToggle =
    document.getElementById('login-toggle');

  if (loginSubmit) {
    loginSubmit.textContent = isSignupMode
      ? roxT('auth.createAccount')
      : roxT('auth.signIn');
  }

  if (loginToggle) {
    loginToggle.innerHTML = isSignupMode
      ? roxT('auth.haveAccountHtml')
      : roxT('auth.noAccountHtml');
  }

  if (profile) {
    const displayName =
      profile.full_name ||
      profile.email?.split('@')[0] ||
      '';

    const greeting =
      document.getElementById('heroGreeting');

    if (greeting) {
      greeting.textContent =
        roxT('home.greetingName', {
          name: displayName
        });
    }

    const topbarPlan =
      document.getElementById('topbarUserPlan');

    if (topbarPlan) {
      topbarPlan.textContent =
        profile.subscription_status === 'pro'
          ? roxT('settings.account.planPro')
          : roxT('settings.account.planFree');
    }
  }

  if (lastRoxUsage?.type === 'daily') {
    renderDailyUsage(
      lastRoxUsage.used,
      lastRoxUsage.limit
    );
  } else if (lastRoxUsage?.type === 'pro') {
    renderProUsage(
      lastRoxUsage.used,
      lastRoxUsage.total,
      lastRoxUsage.remaining
    );
  }

  if (
    typeof selectedTopupCredits !== 'undefined' &&
    document.getElementById('topupSlider')
  ) {
    setTopupCredits(selectedTopupCredits);
  }
}

function getRoxBooleanSetting(key, fallback = false) {
  const value = localStorage.getItem(key);

  if (value === null) {
    return fallback;
  }

  return value === 'true';
}

function setRoxBooleanSetting(key, value) {
  localStorage.setItem(
    key,
    String(Boolean(value))
  );
}

function getRoxSystemTheme() {
  return window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: light)').matches
      ? 'light'
      : 'dark';
}

function applyRoxTheme(themeValue) {
  const selectedTheme =
    themeValue || 'system';

  const resolvedTheme =
    selectedTheme === 'system'
      ? getRoxSystemTheme()
      : selectedTheme;

  document.documentElement.dataset.roxTheme =
    resolvedTheme;

  document.documentElement.dataset.roxThemePreference =
    selectedTheme;
}

function applyRoxDensity(densityValue) {
  document.documentElement.dataset.roxDensity =
    densityValue === 'compact'
      ? 'compact'
      : 'comfortable';
}

function resolveRoxUiLanguage(languageValue) {
  if (
    languageValue &&
    languageValue !== 'auto'
  ) {
    return languageValue;
  }

  return (
    navigator.languages &&
    navigator.languages[0]
      ? navigator.languages[0]
      : navigator.language || 'fr'
  ).split('-')[0];
}

function applyRoxUiLanguage(languageValue) {
  const resolvedLanguage =
    resolveRoxUiLanguage(languageValue);

  document.documentElement.lang =
    resolvedLanguage;

  document.documentElement.dir =
    resolvedLanguage === 'ar'
      ? 'rtl'
      : 'ltr';

  document.documentElement.dataset.roxUiLanguage =
    resolvedLanguage;


  translateRoxUi();
  syncRoxSettingsAccount();
  syncRoxDynamicUi();
}

function getRoxSpeechRate() {
  const savedRate = Number(
    localStorage.getItem(
      ROX_SETTINGS_KEYS.voiceRate
    )
  );

  if (
    Number.isFinite(savedRate) &&
    savedRate >= 0.75 &&
    savedRate <= 1.5
  ) {
    return savedRate;
  }

  return 1;
}

function getRoxSelectedVoice(voices) {
  const selectedVoiceId =
    localStorage.getItem(
      ROX_SETTINGS_KEYS.voiceName
    );

  if (!selectedVoiceId) {
    return null;
  }

  return voices.find(
    voice =>
      voice.voiceURI === selectedVoiceId ||
      voice.name === selectedVoiceId
  ) || null;
}

function speakRoxText(text) {
  if (
    !text ||
    !('speechSynthesis' in window)
  ) {
    return;
  }

  const speech =
    new SpeechSynthesisUtterance(
      String(text)
    );

  const selectedLanguage =
    localStorage.getItem(
      'roxVoiceLanguage'
    );

  const isArabic =
    /[\u0600-\u06FF]/.test(
      String(text)
    );

  const preferredLang =
    selectedLanguage ||
    (
      isArabic
        ? 'ar-MA'
        : (
            document.documentElement.lang ||
            navigator.language ||
            'fr-FR'
          )
    );

  speech.lang = preferredLang;
  speech.rate = getRoxSpeechRate();
  speech.pitch = 1;
  speech.volume = 1;

  const voices =
    window.speechSynthesis.getVoices();

  const selectedVoice =
    getRoxSelectedVoice(voices);

  const exactVoice = voices.find(
    voice =>
      voice.lang.toLowerCase() ===
      preferredLang.toLowerCase()
  );

  const languageVoice = voices.find(
    voice =>
      voice.lang.toLowerCase().startsWith(
        preferredLang
          .toLowerCase()
          .split('-')[0]
      )
  );

  speech.voice =
    selectedVoice ||
    exactVoice ||
    languageVoice ||
    null;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);
}

function maybeAutoReadRoxMessage(text) {
  if (
    !getRoxBooleanSetting(
      ROX_SETTINGS_KEYS.autoRead,
      false
    )
  ) {
    return;
  }

  speakRoxText(text);
}

function populateRoxSettingsVoiceLanguages() {
  const select =
    document.getElementById(
      'settingsVoiceLanguage'
    );

  if (
    !select ||
    typeof voiceLanguages === 'undefined'
  ) {
    return;
  }

  select.innerHTML = '';

  voiceLanguages.forEach(
    ([value, label]) => {
      const option =
        document.createElement('option');

      option.value = value;
      option.textContent = label;

      select.appendChild(option);
    }
  );

  select.value =
    localStorage.getItem(
      'roxVoiceLanguage'
    ) || '';
}

function populateRoxSettingsVoices() {
  const select =
    document.getElementById(
      'settingsVoiceName'
    );

  if (
    !select ||
    !('speechSynthesis' in window)
  ) {
    return;
  }

  const previousValue =
    localStorage.getItem(
      ROX_SETTINGS_KEYS.voiceName
    ) || '';

  const voices =
    window.speechSynthesis
      .getVoices()
      .slice()
      .sort((a, b) =>
        `${a.lang} ${a.name}`.localeCompare(
          `${b.lang} ${b.name}`
        )
      );

  select.innerHTML = '';

  const automaticOption =
    document.createElement('option');

  automaticOption.value = '';
  automaticOption.textContent =
    'Automatique';

  select.appendChild(
    automaticOption
  );

  voices.forEach(voice => {
    const option =
      document.createElement('option');

    option.value =
      voice.voiceURI || voice.name;

    option.textContent =
      `${voice.name} — ${voice.lang}`;

    select.appendChild(option);
  });

  select.value = voices.some(
    voice =>
      voice.voiceURI === previousValue ||
      voice.name === previousValue
  )
    ? previousValue
    : '';
}

function syncRoxSettingsAccount() {
  const nameElement =
    document.getElementById(
      'settingsAccountName'
    );

  const emailElement =
    document.getElementById(
      'settingsAccountEmail'
    );

  const planElement =
    document.getElementById(
      'settingsPlanStatus'
    );

  const usageElement =
    document.getElementById(
      'settingsUsageStatus'
    );

  const accountEmail =
    profile?.email ||
    session?.user?.email ||
    '—';

  const accountName =
    profile?.full_name ||
    accountEmail.split('@')[0] ||
    '—';

  const isPro =
    profile?.subscription_status ===
    'pro';

  if (nameElement) {
    nameElement.textContent =
      accountName;
  }

  if (emailElement) {
    emailElement.textContent =
      accountEmail;
  }

  if (planElement) {
    planElement.textContent =
      isPro
        ? roxT('settings.account.planPro')
        : roxT('settings.account.planFree');
  }

  if (usageElement) {
    const usageSource =
      document.getElementById(
        'sidebarCreditsNum'
      );

    usageElement.textContent =
      usageSource?.textContent ||
      roxT('settings.common.loading');
  }
}

function refreshRoxSettingsFormValues() {
  const fields = {
    settingsUiLanguage:
      localStorage.getItem(
        ROX_SETTINGS_KEYS.uiLanguage
      ) || 'auto',

    settingsTheme:
      localStorage.getItem(
        ROX_SETTINGS_KEYS.theme
      ) || 'system',

    settingsStartPage:
      localStorage.getItem(
        ROX_SETTINGS_KEYS.startPage
      ) || 'home',

    settingsDensity:
      localStorage.getItem(
        ROX_SETTINGS_KEYS.density
      ) || 'comfortable',

    settingsVoiceLanguage:
      localStorage.getItem(
        'roxVoiceLanguage'
      ) || '',

    settingsVoiceName:
      localStorage.getItem(
        ROX_SETTINGS_KEYS.voiceName
      ) || ''
  };

  Object.entries(fields).forEach(
    ([id, value]) => {
      const element =
        document.getElementById(id);

      if (element) {
        element.value = value;
      }
    }
  );

  const voiceRate =
    document.getElementById(
      'settingsVoiceRate'
    );

  if (voiceRate) {
    voiceRate.value =
      String(getRoxSpeechRate());

    voiceRate.title =
      `${voiceRate.value}x`;
  }

  const autoRead =
    document.getElementById(
      'settingsAutoRead'
    );

  if (autoRead) {
    autoRead.checked =
      getRoxBooleanSetting(
        ROX_SETTINGS_KEYS.autoRead,
        false
      );
  }

  const stopVoice =
    document.getElementById(
      'settingsStopVoiceOnRecord'
    );

  if (stopVoice) {
    stopVoice.checked =
      getRoxBooleanSetting(
        ROX_SETTINGS_KEYS.stopVoiceOnRecord,
        true
      );
  }

  syncRoxSettingsAccount();
}

function scheduleRoxStartPage() {
  if (!session) {
    return;
  }

  const startPage =
    localStorage.getItem(
      ROX_SETTINGS_KEYS.startPage
    ) || 'home';

  const userId =
    session.user?.id || 'current';

  const sessionKey =
    `roxStartPageOpened:${userId}`;

  if (
    sessionStorage.getItem(sessionKey)
  ) {
    return;
  }

  sessionStorage.setItem(
    sessionKey,
    'true'
  );

  setTimeout(() => {
    if (startPage === 'home') {
      document
        .querySelector('[data-tab="home"]')
        ?.click();

      return;
    }

    document
      .querySelector(
        `[data-open="${startPage}"]`
      )
      ?.click();
  }, 250);
}

function setupRoxSettingsCore() {
  const bindSelect = (
    id,
    storageKey,
    applyFunction = null
  ) => {
    const element =
      document.getElementById(id);

    element?.addEventListener(
      'change',
      () => {
        localStorage.setItem(
          storageKey,
          element.value
        );

        applyFunction?.(
          element.value
        );
      }
    );
  };

  applyRoxTheme(
    localStorage.getItem(
      ROX_SETTINGS_KEYS.theme
    ) || 'system'
  );

  applyRoxDensity(
    localStorage.getItem(
      ROX_SETTINGS_KEYS.density
    ) || 'comfortable'
  );

  applyRoxUiLanguage(
    localStorage.getItem(
      ROX_SETTINGS_KEYS.uiLanguage
    ) || 'auto'
  );

  populateRoxSettingsVoiceLanguages();
  populateRoxSettingsVoices();
  refreshRoxSettingsFormValues();

  bindSelect(
    'settingsUiLanguage',
    ROX_SETTINGS_KEYS.uiLanguage,
    applyRoxUiLanguage
  );

  bindSelect(
    'settingsTheme',
    ROX_SETTINGS_KEYS.theme,
    applyRoxTheme
  );

  bindSelect(
    'settingsStartPage',
    ROX_SETTINGS_KEYS.startPage
  );

  bindSelect(
    'settingsDensity',
    ROX_SETTINGS_KEYS.density,
    applyRoxDensity
  );

  const voiceLanguage =
    document.getElementById(
      'settingsVoiceLanguage'
    );

  voiceLanguage?.addEventListener(
    'change',
    () => {
      setVoiceLanguage(
        voiceLanguage.value
      );
    }
  );

  const voiceName =
    document.getElementById(
      'settingsVoiceName'
    );

  voiceName?.addEventListener(
    'change',
    () => {
      if (voiceName.value) {
        localStorage.setItem(
          ROX_SETTINGS_KEYS.voiceName,
          voiceName.value
        );
      } else {
        localStorage.removeItem(
          ROX_SETTINGS_KEYS.voiceName
        );
      }
    }
  );

  const voiceRate =
    document.getElementById(
      'settingsVoiceRate'
    );

  voiceRate?.addEventListener(
    'input',
    () => {
      localStorage.setItem(
        ROX_SETTINGS_KEYS.voiceRate,
        voiceRate.value
      );

      voiceRate.title =
        `${voiceRate.value}x`;
    }
  );

  const autoRead =
    document.getElementById(
      'settingsAutoRead'
    );

  autoRead?.addEventListener(
    'change',
    () => {
      setRoxBooleanSetting(
        ROX_SETTINGS_KEYS.autoRead,
        autoRead.checked
      );
    }
  );

  const stopVoice =
    document.getElementById(
      'settingsStopVoiceOnRecord'
    );

  stopVoice?.addEventListener(
    'change',
    () => {
      setRoxBooleanSetting(
        ROX_SETTINGS_KEYS.stopVoiceOnRecord,
        stopVoice.checked
      );
    }
  );

  document
    .querySelectorAll(
      '[data-open="settings"]'
    )
    .forEach(button => {
      button.addEventListener(
        'click',
        () => {
          setTimeout(() => {
            populateRoxSettingsVoiceLanguages();
            populateRoxSettingsVoices();
            refreshRoxSettingsFormValues();
          }, 0);
        }
      );
    });

  window.speechSynthesis
    ?.addEventListener?.(
      'voiceschanged',
      populateRoxSettingsVoices
    );

  const usageSource =
    document.getElementById(
      'sidebarCreditsNum'
    );

  if (usageSource) {
    new MutationObserver(
      syncRoxSettingsAccount
    ).observe(
      usageSource,
      {
        childList:true,
        subtree:true,
        characterData:true
      }
    );
  }
}

setTimeout(
  setupRoxSettingsCore,
  0
);

const ROX_AI_PREFERENCE_KEYS = {
  language: 'roxAiResponseLanguage',
  length: 'roxAiResponseLength',
  tone: 'roxAiResponseTone'
};

const ROX_AI_PREFERENCE_DEFAULTS = {
  language: 'auto',
  length: 'balanced',
  tone: 'natural'
};

function getRoxAiPreference(
  preferenceName
) {
  const storageKey =
    ROX_AI_PREFERENCE_KEYS[
      preferenceName
    ];

  return (
    localStorage.getItem(storageKey) ||
    ROX_AI_PREFERENCE_DEFAULTS[
      preferenceName
    ]
  );
}

function getRoxAiPreferences() {
  return {
    language:
      getRoxAiPreference('language'),

    length:
      getRoxAiPreference('length'),

    tone:
      getRoxAiPreference('tone')
  };
}

function refreshRoxAiPreferenceFields() {
  const fields = {
    settingsResponseLanguage:
      getRoxAiPreference('language'),

    settingsResponseLength:
      getRoxAiPreference('length'),

    settingsResponseTone:
      getRoxAiPreference('tone')
  };

  Object.entries(fields).forEach(
    ([id, value]) => {
      const element =
        document.getElementById(id);

      if (element) {
        element.value = value;
      }
    }
  );
}

function setupRoxAiPreferences() {
  const language =
    document.getElementById(
      'settingsResponseLanguage'
    );

  const length =
    document.getElementById(
      'settingsResponseLength'
    );

  const tone =
    document.getElementById(
      'settingsResponseTone'
    );

  const resetButton =
    document.getElementById(
      'settingsResetAiPreferences'
    );

  const bindPreference = (
    element,
    preferenceName
  ) => {
    element?.addEventListener(
      'change',
      () => {
        localStorage.setItem(
          ROX_AI_PREFERENCE_KEYS[
            preferenceName
          ],
          element.value
        );
      }
    );
  };

  bindPreference(
    language,
    'language'
  );

  bindPreference(
    length,
    'length'
  );

  bindPreference(
    tone,
    'tone'
  );

  resetButton?.addEventListener(
    'click',
    () => {
      Object.values(
        ROX_AI_PREFERENCE_KEYS
      ).forEach(key => {
        localStorage.removeItem(key);
      });

      refreshRoxAiPreferenceFields();

      const originalText =
        resetButton.textContent;

      resetButton.textContent =
        roxT('settings.ai.resetSuccess');

      setTimeout(() => {
        resetButton.textContent =
          originalText;
      }, 1600);
    }
  );

  document
    .querySelectorAll(
      '[data-open="settings"]'
    )
    .forEach(button => {
      button.addEventListener(
        'click',
        () => {
          setTimeout(
            refreshRoxAiPreferenceFields,
            0
          );
        }
      );
    });

  refreshRoxAiPreferenceFields();
}

setTimeout(
  setupRoxAiPreferences,
  0
);

const getBackendUnavailableMessage = () =>
  roxT('config.backendUnavailable');

async function authFetch(path, options = {}) {
  if (!session) { showLogin(); throw new Error('not_authenticated'); }
  if (session.access_token === DEMO_TOKEN) return demoFetch(path, options);

  let res;
  try {
    res = await fetch(CONFIG.API_BASE + path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${session.access_token}`,
        ...(options.headers || {}),
      },
    });
  } catch (networkErr) {
    // fetch() throws (TypeError: Failed to fetch) when the backend is
    // down/unreachable — surface that clearly instead of a generic error.
    console.error('[authFetch] backend unreachable:', networkErr.message);
    showConfigBanner(getBackendUnavailableMessage());
    throw new Error('backend_unavailable');
  }

  if (res.status === 401) {
    await supa.auth.signOut();
    showLogin();
    throw new Error('session_expired');
  }
  return res;
}

function openRoxHistoryItem(item){
  if(!item || !item.content || typeof item.content !== 'object') return;

  const content = item.content;
  const feature = String(content.feature || 'chat').toLowerCase() === 'code'
    ? 'code'
    : 'chat';

  const savedMessages = Array.isArray(content.messages)
    ? content.messages
    : [];

  const assistant =
    content.assistant && typeof content.assistant === 'object'
      ? content.assistant
      : null;

  const transcript = savedMessages
    .filter(message =>
      message &&
      (message.role === 'user' || message.role === 'assistant') &&
      typeof message.content === 'string' &&
      message.content.trim()
    )
    .map(message => ({
      role: message.role,
      content: message.content
    }));

  if(
    assistant &&
    typeof assistant.content === 'string' &&
    assistant.content.trim()
  ){
    transcript.push({
      role: 'assistant',
      content: assistant.content,
      responseId: assistant.responseId || null,
      model: assistant.model || null
    });
  }

  conversations[feature] = transcript
    .slice(-CHAT_HISTORY_LIMIT)
    .map(message => ({
      role: message.role,
      content: message.content
    }));

  const msgBox = document.getElementById('msgs-' + feature);
  const featureView = document.getElementById('feature-' + feature);
  const historyView = document.getElementById('feature-history');

  if(!msgBox || !featureView) return;

  msgBox.innerHTML = '';

  transcript.forEach(message => {
    const isAssistant = message.role === 'assistant';

    appendMsg(
      msgBox,
      isAssistant ? 'bot' : 'user',
      message.content,
      false,
      isAssistant
        ? {
            responseId: message.responseId || null,
            model: message.model || null,
            feature
          }
        : {}
    );
  });

  if(historyView){
    historyView.classList.remove('active');
  }

  featureView.classList.add('active');
  msgBox.scrollTop = msgBox.scrollHeight;

  const input = document.querySelector(
    'input[data-feature="' + feature + '"]'
  );

  if(input){
    setTimeout(() => input.focus(), 0);
  }
}

function bindRoxHistoryRows(target, items){
  target.querySelectorAll('[data-rox-history-id]').forEach(row => {
    row.style.cursor = 'pointer';

    row.addEventListener('click', () => {
      const id = String(row.dataset.roxHistoryId || '');

      const item = items.find(
        candidate => String(candidate?.id || '') === id
      );

      if(item){
        openRoxHistoryItem(item);
      }
    });
  });
}

async function loadRoxHistory(){
  const targets=[...document.querySelectorAll('[data-rox-history-list]')];
  if(!targets.length)return;

  targets.forEach(target=>{
    target.innerHTML='<div class="placeholder-view">Loading history...</div>';
  });

  try{
    const response=await authFetch('/api/history',{method:'GET'});
    const data=await response.json().catch(()=>({}));

    if(!response.ok||data.status!=='success'){
      throw new Error(data.message||('HTTP '+response.status));
    }

    const items=Array.isArray(data.items)?data.items:[];

    if(!items.length){
      targets.forEach(target=>{
        target.innerHTML='<div class="placeholder-view">No saved history yet.</div>';
      });
      return;
    }

    const html=items.map(item=>{
      const content=item&&item.content&&typeof item.content==='object'
        ? item.content
        : {};

      const feature=String(content.feature||'chat').toLowerCase();
      const messages=Array.isArray(content.messages)?content.messages:[];
      const assistant=content.assistant&&typeof content.assistant==='object'
        ? content.assistant
        : {};

      const firstUser=messages.find(message=>message&&message.role==='user'&&message.content);
      const title=String(firstUser?.content||assistant.content||'Saved conversation')
        .replace(/\s+/g,' ')
        .trim()
        .slice(0,80);

      const created=item.created_at
        ? new Date(item.created_at).toLocaleString()
        : '';

      const icon=
        feature==='code'?'⌨️':
        feature==='images'||feature==='image'?'🖼️':
        feature==='videos'||feature==='video'?'🎬':
        '💬';

      const safeTitle=title
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');

      const safeDate=String(created)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');

      return '<div class="prow" data-rox-history-id="'+String(item.id||'')+'">'+
        '<div class="thumb" style="background:var(--panel-2);display:flex;align-items:center;justify-content:center;">'+icon+'</div>'+
        '<div><div class="t">'+safeTitle+'</div><div class="s">'+safeDate+'</div></div>'+
        '<div class="chev">›</div></div>';
    }).join('');

    targets.forEach(target=>{
      target.innerHTML=html;
      bindRoxHistoryRows(target, items);
    });

  }catch(error){
    console.error('[history-ui] load failed:',error);
    targets.forEach(target=>{
      target.innerHTML='<div class="placeholder-view">History could not be loaded.</div>';
    });
  }
}

document.querySelectorAll('[data-open="history"]').forEach(el=>{
  el.addEventListener('click',()=>{
    loadRoxHistory();
  });
});
// ── conversation history (per feature: 'chat' / 'code') ─────────────
// Previously each call to /api/chat sent only the current message
// (`messages: [{role:'user', content:text}]`), so the model had no
// memory of anything said earlier in the same session even though the
// backend (lib/inputValidation.js) already supports a full history up
// to MAX_MESSAGES_PER_CHAT (40). Kept in memory only (cleared on page
// reload) — no browser storage involved.
const CHAT_HISTORY_LIMIT = 40; // mirrors backend MAX_MESSAGES_PER_CHAT default
const conversations = { chat: [], code: [] };

function pushHistory(feature, role, content) {
  const hist = conversations[feature];
  if (!hist) return;
  hist.push({ role, content });
  if (hist.length > CHAT_HISTORY_LIMIT) hist.splice(0, hist.length - CHAT_HISTORY_LIMIT);
}

// ── message rendering helpers ───────────────────────────────────────
function appendMsg(msgBox, cls, content, isNode, meta = {}) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;

  if (isNode) {
    el.appendChild(content);
  } else {
    el.textContent = content;
  }

  msgBox.appendChild(el);

  const isBotMessage = String(cls)
    .split(/\s+/)
    .includes('bot');

  if (isBotMessage) {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    const showFeedback = (message) => {
      let note = actions.nextElementSibling;

      if (!note || !note.classList.contains('msg-feedback')) {
        note = document.createElement('div');
        note.className = 'msg-feedback';
        actions.insertAdjacentElement('afterend', note);
      }

      note.textContent = message;
      note.classList.add('show');

      clearTimeout(note._hideTimer);
      note._hideTimer = setTimeout(() => {
        note.classList.remove('show');
      }, 1600);
    };

    // ROX SAVE FEEDBACK START
    const saveFeedback = async (rating) => {
      if (!meta.responseId) {
        showFeedback(
          roxT('feedback.newResponsesOnly')
        );
        return false;
      }

      try {
        const response = await authFetch('/api/chat-feedback', {
          method: 'POST',
          body: JSON.stringify({
            responseId: meta.responseId,
            rating,
            model: meta.model || null,
            feature: meta.feature || 'chat'
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.message || 'feedback_save_failed'
          );
        }

        return true;
      } catch (error) {
        console.error(
          'ROX AI feedback save failed:',
          error
        );

        showFeedback(
          roxT('feedback.saveFailed')
        );

        return false;
      }
    };
    // ROX SAVE FEEDBACK END
    const getMessageText = () =>
      (el.innerText || el.textContent || '').trim();

    const makeAction = (symbol, titleKey, handler) => {
      const button = document.createElement('button');
      const title = roxT(titleKey);

      button.type = 'button';
      button.className = 'msg-action';
      button.textContent = symbol;
      button.title = title;
      button.setAttribute('aria-label', title);
      button.dataset.i18nTitle = titleKey;
      button.dataset.i18nAriaLabel = titleKey;

      button.addEventListener('click', async () => {
        try {
          await handler(button);
        } catch (error) {
          console.error('ROX AI message action failed:', error);
        }
      });

      actions.appendChild(button);
      return button;
    };

    const copyText = async (text) => {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    };

    makeAction('\u2398', 'feedback.copy', async (button) => {
      const text = getMessageText();
      if (!text) return;

      await copyText(text);

      const oldSymbol = button.textContent;
      button.textContent = '\u2713';

      setTimeout(() => {
        button.textContent = oldSymbol;
      }, 1200);
    });

    makeAction('\uD83D\uDD0A', 'feedback.listen', (button) => {
      if (!('speechSynthesis' in window)) return;

      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        button.classList.remove('is-active');
        return;
      }

      const text = getMessageText();
      if (!text) return;

      const speech = new SpeechSynthesisUtterance(text);
      const isArabic = /[\u0600-\u06FF]/.test(text);

      const preferredLang = isArabic
        ? 'ar-MA'
        : (document.documentElement.lang ||
           navigator.language ||
           'fr-FR');

      speech.lang = preferredLang;
      speech.rate = getRoxSpeechRate();
      speech.pitch = 1;
      speech.volume = 1;

      const voices = window.speechSynthesis.getVoices();

      const exactVoice = voices.find(
        voice =>
          voice.lang.toLowerCase() === preferredLang.toLowerCase()
      );

      const arabicVoice = isArabic
        ? voices.find(voice => /^ar(-|$)/i.test(voice.lang))
        : null;

      const languageVoice = voices.find(
        voice =>
          voice.lang.toLowerCase().startsWith(
            preferredLang.toLowerCase().split('-')[0]
          )
      );

      const savedVoice =
        getRoxSelectedVoice(voices);

      const selectedVoice =
        savedVoice ||
        exactVoice ||
        arabicVoice ||
        languageVoice;

      if (selectedVoice) {
        speech.voice = selectedVoice;
      }

      button.classList.add('is-active');

      const stopActiveState = () => {
        button.classList.remove('is-active');
      };

      speech.onend = stopActiveState;
      speech.onerror = stopActiveState;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(speech);
    });

    let likeButton;
    let dislikeButton;

    likeButton = makeAction('\uD83D\uDC4D', 'feedback.like', async (button) => {
      const nowActive =
        !button.classList.contains('is-active');

      const rating = nowActive ? 1 : 0;

      button.disabled = true;

      if (dislikeButton) {
        dislikeButton.disabled = true;
      }

      const saved = await saveFeedback(rating);

      button.disabled = false;

      if (dislikeButton) {
        dislikeButton.disabled = false;
      }

      if (!saved) return;

      button.classList.toggle(
        'is-active',
        nowActive
      );

      dislikeButton?.classList.remove('is-active');

      button.classList.add('bump');

      setTimeout(
        () => button.classList.remove('bump'),
        280
      );

      showFeedback(
        nowActive
          ? roxT('feedback.thanksLike')
          : roxT('feedback.removed')
      );
    });

    dislikeButton = makeAction('\uD83D\uDC4E', 'feedback.dislike', async (button) => {
      const nowActive =
        !button.classList.contains('is-active');

      const rating = nowActive ? -1 : 0;

      button.disabled = true;

      if (likeButton) {
        likeButton.disabled = true;
      }

      const saved = await saveFeedback(rating);

      button.disabled = false;

      if (likeButton) {
        likeButton.disabled = false;
      }

      if (!saved) return;

      button.classList.toggle(
        'is-active',
        nowActive
      );

      likeButton?.classList.remove('is-active');

      button.classList.add('bump');

      setTimeout(
        () => button.classList.remove('bump'),
        280
      );

      showFeedback(
        nowActive
          ? roxT('feedback.thanks')
          : roxT('feedback.removed')
      );
    });

    makeAction('\u2197', 'feedback.share', async () => {
      const text = getMessageText();
      if (!text) return;

      if (navigator.share) {
        await navigator.share({
          title: 'ROX AI',
          text
        });
      } else {
        await copyText(text);
      }
    });

    makeAction('\u2193', 'feedback.download', () => {
      const text = getMessageText();
      if (!text) return;

      const blob = new Blob([text], {
        type: 'text/plain;charset=utf-8'
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download = 'rox-ai-response.txt';
      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);
    });

    msgBox.appendChild(actions);
  }

  msgBox.scrollTop = msgBox.scrollHeight;
  return el;
}

// ── chat / code → POST /api/chat ────────────────────────────────────
function createCodeArtifact(rawText) {
  const fenced = String(rawText || '').match(/```([a-zA-Z0-9+#.-]*)\s*([\s\S]*?)```/);
  const language = (fenced?.[1] || '').toLowerCase();

  let code = (fenced ? fenced[2] : String(rawText || '')).trim();
  const htmlStart = code.search(/<!doctype html|<html[\s>]/i);
  if (htmlStart > 0) code = code.slice(htmlStart);

  if (!code) return null;

  const isHtml = /<!doctype html|<html[\s>]|<body[\s>]/i.test(code);
  const extensions = {
    javascript: 'js',
    js: 'js',
    typescript: 'ts',
    ts: 'ts',
    python: 'py',
    css: 'css',
    html: 'html'
  };

  const extension = isHtml ? 'html' : (extensions[language] || 'txt');
  const fileName = isHtml ? 'index.html' : `main.${extension}`;

  const escapeHtml = value => String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;');

  const previewDocument = isHtml
    ? code
    : `<!doctype html><html><body style="margin:0;background:#111114;color:#e5e7eb;"><pre style="padding:24px;white-space:pre-wrap;font:14px/1.6 monospace;">${escapeHtml(code)}</pre></body></html>`;

  const card = document.createElement('div');
  card.className = 'artifact-card';

  card.innerHTML = `
    <div class="artifact-head">
      <div class="artifact-title">
        <div class="artifact-icon">⌨️</div>
        <div>
          <div class="artifact-name">${fileName}</div>
          <div class="artifact-type" data-i18n="${isHtml ? 'artifact.webApp' : 'artifact.generatedCode'}">${roxT(isHtml ? 'artifact.webApp' : 'artifact.generatedCode')}</div>
        </div>
      </div>
      <button class="artifact-open" type="button" data-i18n="artifact.open">${roxT('artifact.open')}</button>
    </div>

    <iframe class="artifact-preview" sandbox="allow-scripts allow-forms allow-modals allow-downloads" referrerpolicy="no-referrer" title="${roxT('artifact.previewTitle')}" data-i18n-title="artifact.previewTitle"></iframe>

    <div class="artifact-actions">
      <button type="button" data-artifact-preview data-i18n="artifact.preview">${roxT('artifact.preview')}</button>
      <button type="button" data-artifact-code data-i18n="artifact.code">${roxT('artifact.code')}</button>
      <button type="button" data-artifact-copy data-i18n="artifact.copy">${roxT('artifact.copy')}</button>

    link.href = URL.createObjectURL(blob);

    setTimeout(() => URL.revokeObjectURL(link.href), 1000);

  modal.querySelectorAll('[data-tab]').forEach(button => {

  modal.onclick = event => {

async function sendChat(feature, text, msgBox) {
  if (feature === 'code') appendMsg(msgBox, 'status', roxT('usage.estimatedCodeCost'));
  const typing = appendTyping(msgBox);
  // Send the stored history PLUS this new turn, but don't commit the new
  // turn to `conversations[feature]` until the call actually succeeds.
  // The Anthropic Messages API requires strict user/assistant
  // alternation — if we saved the user turn up front and the call then
  // failed (402/429/network error), a retry would stack two 'user'
  // turns in a row with nothing in between, which the API rejects.
  const outgoing = [...conversations[feature], { role: 'user', content: text }];
  try {
    const res = await authFetch('/api/chat', {
      method: 'POST',
      body: JSON.stringify({
        messages: outgoing,
        feature,
        aiPreferences:
          getRoxAiPreferences()
      }),
    });
    const data = await res.json();
    typing.remove();

    if (res.status === 402) {
      let msg = roxT('error.insufficientCredits');
      if (data.code === 'code_requires_pro') msg = roxT('error.codeRequiresPro');
      if (data.code === 'pro_out_of_credits') msg = `💳 ${data.message}`;
      appendMsg(msgBox, 'status', msg);
      return;
    }
    if (res.status === 429 && data.code === 'daily_chat_limit') {
      appendMsg(msgBox, 'status', `🌙 ${data.message}`);
      return;
    }
    if (res.status === 429) { appendMsg(msgBox, 'status', roxT('error.tooManyRequests', { seconds: data.retry_after_seconds || roxT('error.fewSeconds') })); return; }
    if (res.status === 400) {
      // Conversation grew past what the backend accepts in one request
      // (message count/char limits) — drop the oldest turns and let the
      // user retry, instead of silently failing forever.
      conversations[feature] = conversations[feature].slice(-10);
      appendMsg(msgBox, 'error', roxT('error.conversationTooLong'));
      return;
    }
    if (!res.ok) { appendMsg(msgBox, 'error', data.message || roxT('error.allModelsFailed')); return; }

    if (feature === 'code') {
  const artifact = createCodeArtifact(data.text);

  if (artifact) {
    msgBox.appendChild(artifact);
    msgBox.scrollTop = msgBox.scrollHeight;
  } else {
    appendMsg(msgBox, 'bot', data.text, false, { responseId: data.responseId, model: data.model, feature });
  }
} else {
  appendMsg(msgBox, 'bot', data.text, false, { responseId: data.responseId, model: data.model, feature });
}
  if (feature === 'chat') {
    maybeAutoReadRoxMessage(data.text);
  }
  if (feature === 'code' && typeof data.creditsCharged === 'number') {
    appendMsg(msgBox, 'status', roxT('usage.finalCost', { credits: data.creditsCharged }));
  }
    pushHistory(feature, 'user', text);
    pushHistory(feature, 'assistant', data.text);
    if (typeof data.dailyChatUsed === 'number') {
      renderDailyUsage(data.dailyChatUsed, data.dailyChatLimit);
    }
    if (typeof data.newBalance === 'number' && profile) {
      const total = profile.credits_total || 500;
      const used = total - data.newBalance;
      renderProUsage(used, total, data.newBalance);
    }
  } catch (err) {
    typing.remove();
    if (err.message === 'backend_unavailable') appendMsg(msgBox, 'error', getBackendUnavailableMessage());
    else if (err.message !== 'session_expired') appendMsg(msgBox, 'error', roxT('error.network'));
  }
}

// ── images / videos → POST /api/generate-* then poll job status ────
const GEN_ROUTES = { images: '/api/generate-image', videos: '/api/generate-video' };
const GEN_POLL_MS = 2500;
const GEN_TIMEOUT_MS = 120000;

async function sendGeneration(feature, text, msgBox) {
  const typing = appendTyping(msgBox);
  try {
    const res = await authFetch(GEN_ROUTES[feature], { method: 'POST', body: JSON.stringify({ prompt: text, aiPreferences: getRoxAiPreferences() }) });
    const data = await res.json();

    if (res.status === 403 && data.code === 'pro_out_of_credits') {
      typing.remove();
      appendMsg(msgBox, 'status', `💳 ${data.message}`);
      return;
    }
    if (res.status === 402) {
      typing.remove();
      let msg = roxT('error.insufficientCredits');
      if (data.code === 'video_requires_pro') msg = roxT('error.videoRequiresPro');
      if (data.code === 'image_requires_pro') msg = roxT('error.imageRequiresPro');
      appendMsg(msgBox, 'status', msg);
      return;
    }
    if (res.status === 429) { typing.remove(); appendMsg(msgBox, 'status', roxT('error.tooManyRequests', { seconds: data.retry_after_seconds || roxT('error.fewSeconds') })); return; }
    if (!res.ok || !data.jobId) { typing.remove(); appendMsg(msgBox, 'error', data.message || roxT('error.jobCreate')); return; }

    if (typeof data.newBalance === 'number' && profile) {
      const total = profile.credits_total || 500;
      renderProUsage(total - data.newBalance, total, data.newBalance);
    }

    await pollJob(data.jobId, feature, msgBox, typing);
  } catch (err) {
    typing.remove();
    if (err.message === 'backend_unavailable') appendMsg(msgBox, 'error', getBackendUnavailableMessage());
    else if (err.message !== 'session_expired') appendMsg(msgBox, 'error', roxT('error.network'));
  }
}

async function pollJob(jobId, feature, msgBox, typing) {
  const start = Date.now();
  while (Date.now() - start < GEN_TIMEOUT_MS) {
    await new Promise(r => setTimeout(r, GEN_POLL_MS));
    let res, data;
    try {
      res = await authFetch('/api/job-status/' + jobId);
      data = await res.json();
    } catch (err) {
      if (err.message === 'session_expired') return;
      continue; // transient network error — keep polling
    }
    if (!res.ok) continue;

    if (data.status === 'done') {
      typing.remove();
      const wrap = document.createElement('div');
      if (feature === 'images') {
        const img = document.createElement('img');
        img.src = data.result_url;
        img.alt = roxT('result.generatedAlt');
        wrap.appendChild(img);
      } else {
        const vid = document.createElement('video');
        vid.src = data.result_url;
        vid.controls = true;
        wrap.appendChild(vid);
      }
      appendMsg(msgBox, 'bot', wrap, true);
      return;
    }
    if (data.status === 'failed') {
      typing.remove();
      appendMsg(msgBox, 'error', roxT('error.generationFailed', { error: data.error_message || roxT('error.unknown') }));
      return;
    }
  }
  typing.remove();
  appendMsg(msgBox, 'status', roxT('error.longRunning'));
}

// ── roxip: no backend route yet, kept as a clearly-labeled demo ────
function sendRoxIpDemo(text, msgBox) {
  const typing = appendTyping(msgBox);
  const preferences = getRoxAiPreferences();

  const messages = Object.fromEntries(
    ROX_UI_LANGUAGES.map(languageCode => [
      languageCode,
      {
        concise: roxTForLanguage(
          languageCode,
          'features.roxip.demoOnly',
          { text }
        ),
        balanced: roxTForLanguage(
          languageCode,
          'features.roxip.demoBalanced',
          { text }
        ),
        detailed: roxTForLanguage(
          languageCode,
          'features.roxip.demoDetailed',
          { text }
        )
      }
    ])
  );

  let language = preferences.language;

  if (language === 'auto') {
    if (/[\u0600-\u06FF]/.test(text)) {
      language = 'ar';
    } else {
      language = 'fr';
    }
  }

  const selectedLanguage =
    messages[language] || messages.fr;

  const selectedLength =
    selectedLanguage[preferences.length] ||
    selectedLanguage.balanced;

  let finalMessage = selectedLength;

  if (
    preferences.tone === 'professional' &&
    preferences.length !== 'concise'
  ) {
    finalMessage = roxTForLanguage(
      language,
      'features.roxip.technicalNote',
      { message: finalMessage }
    );
  }

  if (
    preferences.tone === 'creative' &&
    preferences.length !== 'concise'
  ) {
    finalMessage = `✨ ${finalMessage}`;
  }

  setTimeout(() => {
    typing.remove();
    appendMsg(msgBox, 'status', finalMessage);
  }, 700);
}
// ── dispatch ─────────────────────────────────────────────────────────
function sendMessage(feature){
  const input = document.querySelector('input[data-feature="'+feature+'"]');
  const text = input.value.trim();
  if(!text) return;
  const msgBox = document.getElementById('msgs-'+feature);

  appendMsg(msgBox, 'user', text);
  input.value = '';

  if (feature === 'chat' || feature === 'code') sendChat(feature, text, msgBox);
  else if (feature === 'images' || feature === 'videos') sendGeneration(feature, text, msgBox);
  else if (feature === 'roxip') sendRoxIpDemo(text, msgBox);
}

document.querySelectorAll('[data-send]').forEach(btn=>{
  btn.addEventListener('click', ()=>sendMessage(btn.dataset.send));
});
document.querySelectorAll('input[data-feature]').forEach(inp=>{
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(inp.dataset.feature); });
});

// Lets the person type straight into a card on the home screen: it
// opens the matching modal, drops their text into its real input, and
// fires the same sendMessage() pipeline used inside the modal.
function quickSend(feature){
  const cardInput = document.querySelector('input[data-quickfeature="'+feature+'"]');
  let text = cardInput ? cardInput.value.trim() : '';
  if (!text) return;
  if (feature === 'code') {
    const lang = document.getElementById('codeLangSelect');
    if (lang) text = `[${lang.value}] ${text}`;
  }
  document.getElementById('feature-'+feature).classList.add('active');
  const modalInput = document.querySelector('input[data-feature="'+feature+'"]');
  modalInput.value = text;
  sendMessage(feature);
  if (cardInput) cardInput.value = '';
}

});

});

        quickLanguages
      );

      appendSection(
        'All languages',
        allLanguages
      );

      const emptyMessage =
        document.createElement('div');

      emptyMessage.className =
        'rox-voice-language-empty';

      emptyMessage.textContent =
        'No language found';

      emptyMessage.hidden = true;

      optionsBox.appendChild(emptyMessage);

      search.addEventListener(
        'input',
        () => {
          const query =
            normalizeVoiceSearch(
              search.value
            );

          let visibleOptions = 0;

          optionsBox
            .querySelectorAll(
              '.rox-voice-language-option'
            )
            .forEach((option) => {
              const matches =
                !query ||
                option.dataset.search.includes(
                  query
                );

              option.hidden = !matches;

              if (matches) {
                visibleOptions += 1;
              }
            });

          optionsBox
            .querySelectorAll(
              '.rox-voice-language-section'
            )
            .forEach((section) => {
              section.hidden = Boolean(query);
            });

          emptyMessage.hidden =
            visibleOptions !== 0;
        }
      );

      trigger.addEventListener(
        'click',
        (event) => {
          event.stopPropagation();

          const shouldOpen = menu.hidden;

          closeRoxVoiceLanguageMenus(root);

          root.classList.toggle(
            'is-open',
            shouldOpen
          );

          menu.hidden = !shouldOpen;

          trigger.setAttribute(
            'aria-expanded',
            String(shouldOpen)
          );

          if (shouldOpen) {
            requestAnimationFrame(() => {
              search.focus();
            });
          }
        }
      );

      menu.addEventListener(
        'click',
        (event) => {
          event.stopPropagation();
        }
      );
    });

  const savedVoiceLanguage =
    localStorage.getItem(
      'roxVoiceLanguage'
    ) || '';

  const validVoiceLanguage =
    voiceLanguages.some(
      ([value]) =>
        value === savedVoiceLanguage
    )
      ? savedVoiceLanguage
      : '';

  setVoiceLanguage(
    validVoiceLanguage
  );

  document.addEventListener(
    'click',
    () => {
      closeRoxVoiceLanguageMenus();
    }
  );

  document.addEventListener(
    'keydown',
    (event) => {
      if (event.key === 'Escape') {
        closeRoxVoiceLanguageMenus();
      }
    }
  );
  document
    .querySelectorAll('[data-voice-input]')
    .forEach((button) => {
      const feature = button.dataset.voiceInput;

      const input = document.querySelector(
        `input[data-feature="${feature}"]`
      );

      if (!input) return;

      if (!VoiceRecognition) {
        button.addEventListener('click', () => {
          input.placeholder =
            roxT('voice.unavailable');
          input.focus();
        });

        return;
      }

      const recognition = new VoiceRecognition();

      recognition.lang =

        localStorage.getItem("roxVoiceLanguage") ||

        (navigator.languages && navigator.languages[0]) ||

        navigator.language ||

        "ar-MA";
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      const normalPlaceholder =
        input.getAttribute('placeholder') ||
        roxT('features.chat.placeholder');

      let textBeforeRecording = '';

      button.addEventListener('click', () => {
        if (button.classList.contains('is-listening')) {
          recognition.stop();
          return;
        }

        textBeforeRecording = input.value.trim();

        if (
          getRoxBooleanSetting(
            ROX_SETTINGS_KEYS.stopVoiceOnRecord,
            true
          ) &&
          'speechSynthesis' in window
        ) {
          window.speechSynthesis.cancel();
        }

        recognition.lang = getVoiceLanguage();

        try {
          recognition.start();
        } catch (error) {
          console.warn(
            'Voice recognition is already active:',
            error
          );
        }
      });

      recognition.addEventListener('start', () => {
        button.classList.add('is-listening');
        button.setAttribute('aria-pressed', 'true');
        button.title = roxT('voice.stopDictation');
        input.placeholder = roxT('voice.listening');
      });

      recognition.addEventListener('result', (event) => {
        let spokenText = '';

        for (
          let index = event.resultIndex;
          index < event.results.length;
          index++
        ) {
          spokenText +=
            event.results[index][0].transcript + ' ';
        }

        spokenText = spokenText.trim();

        input.value = [
          textBeforeRecording,
          spokenText
        ]
          .filter(Boolean)
          .join(' ');

        input.dispatchEvent(
          new Event('input', {
            bubbles: true
          })
        );
      });

      recognition.addEventListener('end', () => {
        button.classList.remove('is-listening');
        button.setAttribute('aria-pressed', 'false');
        button.title = roxT('voice.dictateMessage');
        input.placeholder =
          input.dataset.i18nPlaceholder
            ? roxT(input.dataset.i18nPlaceholder)
            : normalPlaceholder;
        input.focus();
      });

      recognition.addEventListener('error', (event) => {
        console.warn(
          'Voice recognition error:',
          event.error
        );

        button.classList.remove('is-listening');
        button.setAttribute('aria-pressed', 'false');
        button.title = roxT('voice.dictateMessage');

        input.placeholder =
          event.error === 'not-allowed'
            ? roxT('voice.allowMicrophone')
            : (
                input.dataset.i18nPlaceholder
                  ? roxT(input.dataset.i18nPlaceholder)
                  : normalPlaceholder
              );
      });
    });
}

(function(){
  function roxCleanWelcome(){
    var el=document.getElementById("heroGreeting");
    if(!el) return;

    var raw=(el.textContent||"").trim();

    var name=raw
      .replace(/^Welcome,\s*/i,"")
      .replace(/[!,.]+$/g,"")
      .replace(/[^\p{L}\p{N}_\-. ]+$/gu,"")
      .trim();

    if(!name){
      name="Rox User";
    }

    var clean="Welcome, "+name;

    if(el.textContent!==clean){
      el.textContent=clean;

    var target=document.getElementById("heroGreeting");
    if(!target) return;

    new MutationObserver(function(){
      roxCleanWelcome();
    }).observe(target,{
      childList:true,
      characterData:true,
      subtree:true
    });
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",start);
  }else{
    start();
  }

(function(){

  function initRoxGrid(){

    var hero=document.querySelector(".rox-showcase-hero");
    if(!hero) return;

    var targetX=0;
    var targetY=0;
    var currentX=0;
    var currentY=0;

    hero.addEventListener("mousemove",function(e){

      var r=hero.getBoundingClientRect();

      var px=(e.clientX-r.left)/r.width;
      var py=(e.clientY-r.top)/r.height;

      targetX=(px-.5)*8;
      targetY=(py-.5)*-6;

      hero.style.setProperty("--rox-pointer-x",(px*100)+"%");
      hero.style.setProperty("--rox-pointer-y",(py*100)+"%");
    });

    hero.addEventListener("mouseleave",function(){
      targetX=0;
      targetY=0;

      hero.style.setProperty("--rox-pointer-x","50%");
      hero.style.setProperty("--rox-pointer-y","50%");
    });

    function animate(){

      currentX+=(targetX-currentX)*.075;
      currentY+=(targetY-currentY)*.075;

      hero.style.setProperty("--rox-grid-x",currentX+"deg");
      hero.style.setProperty("--rox-grid-y",currentY+"deg");

      requestAnimationFrame(animate);
    }

    animate();
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",initRoxGrid);
  }else{
    initRoxGrid();
  }

})();

<script>
document.addEventListener("DOMContentLoaded",function(){
  const carousel=document.querySelector(".rox-videos-carousel");
  if(!carousel)return;

  const videos=Array.from(carousel.querySelectorAll(".rox-video-slide"));
  if(!videos.length)return;

  const STEP=2.5;
  let current=0;
  const offsets=videos.map(()=>0);
  let timer=null;

  function showVideo(index){
    videos.forEach((video,i)=>{
      if(i===index){
        video.classList.add("is-active");
      }else{
        video.classList.remove("is-active");
        video.pause();
      }
    });

    const video=videos[index];

    function start(){
      const duration=Number.isFinite(video.duration)?video.duration:0;

      if(duration>0 && offsets[index]>=Math.max(0,duration-0.15)){
        offsets[index]=0;
      }

      try{video.currentTime=offsets[index];}catch(e){}

      const p=video.play();
      if(p&&typeof p.catch==="function"){p.catch(()=>{});}

      clearTimeout(timer);
      timer=setTimeout(function(){
        video.pause();

        const d=Number.isFinite(video.duration)?video.duration:0;
        offsets[index]+=STEP;

        if(d>0 && offsets[index]>=Math.max(0,d-0.15)){
          offsets[index]=0;
        }

        current=(current+1)%videos.length;
        showVideo(current);
      },STEP*1000);
    }

    if(video.readyState>=1){
      start();
    }else{
      video.addEventListener("loadedmetadata",start,{once:true});
      video.load();
    }
  }

  showVideo(current);
});

<script>
(function(){
  function initRoxChatPreview(){
    const chat=document.querySelector(".chat-thumb[data-open='chat']");
    if(!chat)return;

    const messages=Array.from(chat.querySelectorAll(".b"));
    if(messages.length!==16){
      console.warn("ROX Chat preview: expected 16 messages, found",messages.length);
      return;
    }

    let index=0;
    let timer=null;

    function readingTime(message){
      const text=(message.textContent||"").trim();
      let ms=1700+(text.length*18);

      if(/Rox IP/i.test(text)){
        ms=Math.max(ms,6500);
      }

      if(index===messages.length){
        ms=Math.max(ms,5200);
      }

      return Math.min(ms,7000);
    }

    function scrollConversation(duration){
      const start=chat.scrollTop;
      const end=Math.max(0,chat.scrollHeight-chat.clientHeight);

      if(end<=start)return;

      const started=performance.now();

      function frame(now){
        const progress=Math.min(1,(now-started)/duration);
        const eased=1-Math.pow(1-progress,3);

        chat.scrollTop=start+((end-start)*eased);

        if(progress<1){
          requestAnimationFrame(frame);
        }
      }

      requestAnimationFrame(frame);
    }

    function resetConversation(){
      clearTimeout(timer);

      messages.forEach(message=>{
        message.hidden=true;
        message.classList.remove(
          "rox-chat-visible",
          "rox-chat-leaving"
        );
      });

      chat.scrollTop=0;
      index=0;

      timer=setTimeout(showNext,700);
    }

    function showNext(){
      if(index>=messages.length){
        timer=setTimeout(resetConversation,4200);
        return;
      }

      const message=messages[index];
      index+=1;

      message.hidden=false;

      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          message.classList.add("rox-chat-visible");

          const wait=readingTime(message);
          const scrollDuration=Math.max(
            650,
            Math.min(2800,wait*.58)
          );

          scrollConversation(scrollDuration);

          timer=setTimeout(showNext,wait);
        });
      });
    }

    resetConversation();
  }

  if(document.readyState==="loading"){
    document.addEventListener(
      "DOMContentLoaded",
      initRoxChatPreview
    );
  }else{
    initRoxChatPreview();
  }
})();

<script>
(function(){
  function initRoxCodeDemo(){
    const demo=document.querySelector(".rox-code-demo");
    if(!demo)return;

    const promptStage=demo.querySelector(".rox-code-stage-prompt");
    const editorStage=demo.querySelector(".rox-code-stage-editor");
    const buildStage=demo.querySelector(".rox-code-stage-build");
    const previewStage=demo.querySelector(".rox-code-stage-preview");
    const prompt=demo.querySelector(".rox-code-prompt");

    if(!promptStage||!editorStage||!buildStage||!previewStage||!prompt){
      console.warn("ROX Code demo: required stage missing");
      return;
    }

    const fullPrompt=prompt.textContent.trim();
    const editorLines=Array.from(editorStage.children).slice(1);
    const buildLines=Array.from(buildStage.children);
    const timers=[];

    function later(fn,ms){
      const id=setTimeout(fn,ms);
      timers.push(id);
      return id;
    }

    function clearTimers(){
      while(timers.length){
        clearTimeout(timers.pop());
      }
    }

    function hideAllStages(){
      [promptStage,editorStage,buildStage,previewStage].forEach(stage=>{
        stage.hidden=true;
      });
    }

    function typePrompt(){
      prompt.textContent="";
      let i=0;

      function typeNext(){
        if(i>=fullPrompt.length){
          later(showEditor,900);
          return;
        }

        prompt.textContent+=fullPrompt.charAt(i);
        i+=1;

        const pause=/[,.]/.test(fullPrompt.charAt(i-1))?55:18;
        later(typeNext,pause);
      }

      typeNext();
    }

    function showEditor(){
      hideAllStages();
      editorStage.hidden=false;

      editorLines.forEach(line=>{
        line.style.opacity="0";
        line.style.transform="translateY(5px)";
        line.style.transition="opacity .3s ease, transform .35s ease";
      });

      editorLines.forEach((line,i)=>{
        later(()=>{
          line.style.opacity="1";
          line.style.transform="translateY(0)";
        },350+(i*430));
      });

      later(showBuild,350+(editorLines.length*430)+950);
    }

    function showBuild(){
      hideAllStages();
      buildStage.hidden=false;

      buildLines.forEach(line=>{
        line.style.opacity="0";
        line.style.transform="translateX(-6px)";
        line.style.transition="opacity .28s ease, transform .32s ease";
      });

      buildLines.forEach((line,i)=>{
        later(()=>{
          line.style.opacity="1";
          line.style.transform="translateX(0)";
        },250+(i*360));
      });

      later(
        showPreview,
        250+(buildLines.length*360)+1100
      );
    }

    function showPreview(){
      hideAllStages();
      previewStage.hidden=false;
      previewStage.style.opacity="0";
      previewStage.style.transform="scale(.975)";
      previewStage.style.transition="opacity .4s ease, transform .45s cubic-bezier(.22,.8,.22,1)";

      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          previewStage.style.opacity="1";
          previewStage.style.transform="scale(1)";
        });
      });

      later(resetDemo,4800);
    }

    function resetDemo(){
      clearTimers();
      hideAllStages();

      promptStage.hidden=false;
      prompt.textContent=fullPrompt;

      editorLines.forEach(line=>{
        line.removeAttribute("style");
      });

      buildLines.forEach(line=>{
        line.removeAttribute("style");
      });

      previewStage.removeAttribute("style");

      later(()=>{
        prompt.textContent="";
        typePrompt();
      },700);
    }

    resetDemo();
  }

  if(document.readyState==="loading"){
    document.addEventListener(
      "DOMContentLoaded",
      initRoxCodeDemo
    );
  }else{
    initRoxCodeDemo();
  }
})();

<script>
(function(){
  function initRoxIpDemo(){
    const demo=document.querySelector(".rox-ip-demo");
    if(!demo)return;

    const connectStage=demo.querySelector(".rox-ip-stage-connect");
    const workspaceStage=demo.querySelector(".rox-ip-stage-workspace");
    const completeStage=demo.querySelector(".rox-ip-stage-complete");
    const cursor=demo.querySelector(".rox-ip-demo-cursor");

    if(!connectStage||!workspaceStage||!completeStage||!cursor){
      console.warn("ROX IP demo: required stage missing");
      return;
    }

    const stages=[connectStage,workspaceStage,completeStage];
    const timers=[];

    function later(fn,ms){
      const id=setTimeout(fn,ms);
      timers.push(id);
      return id;
    }

    function clearTimers(){
      while(timers.length){
        clearTimeout(timers.pop());
      }
    }

    function showOnly(stage){
      stages.forEach(item=>{
        item.hidden=item!==stage;
      });
    }

    function resetCursor(){
      cursor.style.transition="none";
      cursor.style.left="58%";
      cursor.style.top="53%";
      cursor.style.opacity="1";
    }

    function runWorkspaceMotion(){
      resetCursor();

      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          cursor.style.transition=
            "left 1.05s cubic-bezier(.22,.8,.22,1), top 1.05s cubic-bezier(.22,.8,.22,1)";

          cursor.style.left="73%";
          cursor.style.top="30%";

          later(()=>{
            cursor.style.left="46%";
            cursor.style.top="67%";
          },1200);

          later(()=>{
            cursor.style.left="79%";
            cursor.style.top="72%";
          },2450);
        });
      });
    }

    function showConnect(){
      clearTimers();
      showOnly(connectStage);

      later(showWorkspace,2800);
    }

    function showWorkspace(){
      showOnly(workspaceStage);
      runWorkspaceMotion();

      later(showComplete,5200);
    }

    function showComplete(){
      showOnly(completeStage);

      later(showConnect,3500);
    }

    showConnect();
  }

  if(document.readyState==="loading"){
    document.addEventListener(
      "DOMContentLoaded",
      initRoxIpDemo
    );
  }else{
    initRoxIpDemo();
  }
})();

<script>
// ══════════════════════════════════════════════════════════════════
// ROX AI — single-URL device router
// Runs immediately (synchronously, before the browser paints anything)
// to decide which complete interface to load, then replaces this
// shell document with the full chosen document via document.write().
// Because this happens before first paint and before any visible
// content exists in this shell, there is no flash of the wrong layout.
//
// Breakpoint: screen width <= 768px -> mobile interface
//             screen width  > 768px -> desktop interface
// ══════════════════════════════════════════════════════════════════
(function () {
  'use strict';

  function unescapeScriptTags(raw) {
    // Reverses the escaping applied below (a backslash inserted right
    // after every '<' of a script-closing tag) so the document handed
    // to document.write() is byte-for-byte the original mobile/desktop
    // HTML.
    return raw.replace(/<\\\/script/gi, '<' + '/script');
  }

  var isMobile = window.innerWidth <= 768;
  var sourceId = isMobile ? 'rox-src-mobile' : 'rox-src-desktop';
  var sourceEl = document.getElementById(sourceId);
  var fullHtml = unescapeScriptTags(sourceEl.textContent);

  // ── resize / rotation support ───────────────────────────────────
  // Appended into the chosen document right before its closing
  // </body> tag. If the viewport crosses the 768px breakpoint after
  // load (window resize or device rotation), reload this same URL
  // once so index.html re-detects and serves the correct interface.
  // The reload only fires when the category actually flips (mobile
  // <-> desktop), and a fresh load re-evaluates the flag from the
  // real current width, so this cannot loop indefinitely — it can
  // only fire again after another real crossing of the breakpoint.
  var deviceWatcher =
    '<' + 'script>' +
    '(function(){' +
    'var __roxInitialIsMobile=' + (isMobile ? 'true' : 'false') + ';' +
    'var __roxResizeTimer=null;' +
    'function __roxCheckDevice(){' +
    'var nowMobile=window.innerWidth<=768;' +
    'if(nowMobile!==__roxInitialIsMobile){location.reload();}' +
    '}' +
    'window.addEventListener("resize",function(){' +
    'clearTimeout(__roxResizeTimer);' +
    '__roxResizeTimer=setTimeout(__roxCheckDevice,250);' +
    '});' +
    'window.addEventListener("orientationchange",function(){' +
    'setTimeout(__roxCheckDevice,350);' +
    '});' +
    '})();' +
    '<' + '/script>';

  if (/<\/body>/i.test(fullHtml)) {
    fullHtml = fullHtml.replace(/<\/body>(?![\s\S]*<\/body>)/i, deviceWatcher + '<' + '/body>');
  } else {
    fullHtml += deviceWatcher;
  }

  document.open();
  document.write(fullHtml);
  document.close();
})();
</script>
